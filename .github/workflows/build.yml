                                  mmr.setDataSource(f.absolutePath)
                                  previewBmp = mmr.getFrameAtTime(0)
                                  mmr.release()
                              }
                          }
                      } catch (_: Exception) {}
                      invalidate()
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              parent?.requestDisallowInterceptTouchEvent(true)
                              lastTouchX = event.x; lastTouchY = event.y
                              return true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.x - lastTouchX) / width.coerceAtLeast(1)
                              val dy = (event.y - lastTouchY) / height.coerceAtLeast(1)
                              lastTouchX = event.x; lastTouchY = event.y
                              val newPanX = (prefs.getInt("pan_x", 50) + (dx * 100).toInt()).coerceIn(0, 100)
                              val newPanY = (prefs.getInt("pan_y", 50) + (dy * 100).toInt()).coerceIn(0, 100)
                              panXSeek.progress = newPanX
                              panYSeek.progress = newPanY
                              invalidate()
                              return true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              parent?.requestDisallowInterceptTouchEvent(false)
                          }
                      }
                      return super.onTouchEvent(event)
                  }

