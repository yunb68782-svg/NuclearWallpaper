name: Build Nuclear Wallpaper & Custom Icon Studio 3.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate 3.0 Project & OnePlus Icon Pack Studio
        run: |
          pip install pillow
          mkdir -p app/src/main/java/com/i7ruhua/nuclearwallpaper
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/assets

          python3 - << 'PYEOF'
          import math
          from PIL import Image, ImageDraw, ImageFilter

          OUT = "app/src/main/res/drawable-nodpi"
          S = 512

          def rounded_mask(size, radius):
              mask = Image.new("L", (size, size), 0)
              d = ImageDraw.Draw(mask)
              d.rounded_rectangle([8, 8, size - 8, size - 8], radius=radius, fill=255)
              return mask

          def make_base_squircle(bg_top, bg_bot, border_col, glow_col):
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              grad = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              gd = ImageDraw.Draw(grad)
              for y in range(S):
                  t = y / float(S)
                  r = int(bg_top[0] * (1 - t) + bg_bot[0] * t)
                  g = int(bg_top[1] * (1 - t) + bg_bot[1] * t)
                  b = int(bg_top[2] * (1 - t) + bg_bot[2] * t)
                  gd.line([(0, y), (S, y)], fill=(r, g, b, 248))
              mask = rounded_mask(S, 118)
              img.paste(grad, (0, 0), mask)

              glow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              gdraw = ImageDraw.Draw(glow)
              gdraw.ellipse([96, 96, S - 96, S - 96], fill=(glow_col[0], glow_col[1], glow_col[2], 80))
              glow = glow.filter(ImageFilter.GaussianBlur(42))
              img = Image.alpha_composite(img, glow)

              bdraw = ImageDraw.Draw(img)
              bdraw.rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=border_col, width=8)
              return img

          # 1. 全局图标包底板、高光罩、裁切蒙版
          back = make_base_squircle((16, 23, 41), (8, 11, 22), (0, 245, 212, 190), (123, 44, 191))
          back.save(f"{OUT}/icon_back.png")

          upon = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ud = ImageDraw.Draw(upon)
          ud.rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=(0, 245, 212, 230), width=7)
          ud.rounded_rectangle([18, 18, S - 18, S - 18], radius=110, outline=(155, 93, 229, 120), width=3)
          upon.save(f"{OUT}/icon_upon.png")

          mask_img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          md = ImageDraw.Draw(mask_img)
          md.rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=(255, 255, 255, 255))
          mask_img.save(f"{OUT}/icon_mask.png")

          # 2. 生成 8 款高定赛博图标
          def make_custom_icon(filename, accent1, accent2, mode):
              base = make_base_squircle((18, 25, 46), (7, 10, 20), accent1 + (235,), accent2)
              layer = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              cx, cy = S // 2, S // 2

              if mode == "nuclear":
                  for angle in [0, 60, 120]:
                      rad = math.radians(angle)
                      pts = []
                      for t in range(0, 360, 5):
                          tr = math.radians(t)
                          x0, y0 = 155 * math.cos(tr), 58 * math.sin(tr)
                          xr = cx + x0 * math.cos(rad) - y0 * math.sin(rad)
                          yr = cy + x0 * math.sin(rad) + y0 * math.cos(rad)
                          pts.append((xr, yr))
                      d.polygon(pts, outline=accent1 + (240,), width=10)
                  d.ellipse([cx - 38, cy - 38, cx + 38, cy + 38], fill=accent2 + (255,), outline=(255, 255, 255, 245), width=5)
              elif mode == "blackhole":
                  for r, col, w in [(148, accent2, 11), (112, accent1, 15), (82, (255, 230, 120), 9)]:
                      d.ellipse([cx - r, cy - r, cx + r, cy + r], outline=col + (235,), width=w)
                  d.ellipse([cx - 56, cy - 56, cx + 56, cy + 56], fill=(5, 7, 15, 255))
              elif mode == "chat":
                  d.rounded_rectangle([122, 142, 390, 348], radius=65, fill=accent1 + (50,), outline=accent1 + (245,), width=12)
                  d.ellipse([185, 228, 215, 258], fill=(255, 255, 255, 245))
                  d.ellipse([245, 228, 275, 258], fill=accent2 + (255,))
                  d.ellipse([305, 228, 335, 258], fill=(255, 255, 255, 245))
              elif mode == "game":
                  d.polygon([(cx, 118), (388, cy), (cx, 394), (124, cy)], fill=accent2 + (55,), outline=accent1 + (245,), width=12)
                  d.ellipse([cx - 44, cy - 44, cx + 44, cy + 44], fill=accent1 + (245,))
              elif mode == "video":
                  d.rounded_rectangle([118, 138, 394, 374], radius=54, fill=accent2 + (50,), outline=accent1 + (245,), width=12)
                  d.polygon([(215, 192), (215, 320), (328, 256)], fill=(255, 255, 255, 248))
              elif mode == "code":
                  d.arc([128, 128, 384, 384], start=0, end=360, fill=accent1 + (245,), width=12)
                  d.line([(195, 210), (155, 256), (195, 302)], fill=(255, 255, 255, 248), width=12)
                  d.line([(317, 210), (357, 256), (317, 302)], fill=(255, 255, 255, 248), width=12)
                  d.line([(275, 195), (237, 317)], fill=accent2 + (255,), width=10)
              elif mode == "camera":
                  d.rounded_rectangle([118, 152, 394, 368], radius=48, fill=accent1 + (40,), outline=accent1 + (245,), width=12)
                  d.ellipse([cx - 64, cy - 56, cx + 64, cy + 72], outline=accent2 + (250,), width=12)
                  d.ellipse([cx - 26, cy - 18, cx + 26, cy + 34], fill=(255, 255, 255, 240))
              elif mode == "music":
                  d.ellipse([cx - 135, cy - 135, cx + 135, cy + 135], outline=accent1 + (240,), width=12)
                  d.ellipse([cx - 85, cy - 85, cx + 85, cy + 85], outline=accent2 + (220,), width=8)
                  d.ellipse([cx - 28, cy - 28, cx + 28, cy + 28], fill=(255, 255, 255, 245))

              glow_layer = layer.filter(ImageFilter.GaussianBlur(10))
              out = Image.alpha_composite(base, glow_layer)
              out = Image.alpha_composite(out, layer)
              out.save(f"{OUT}/{filename}.png")

          make_custom_icon("ic_launcher", (0, 245, 212), (247, 37, 133), "nuclear")
          make_custom_icon("ic_nuclear_cyan", (0, 245, 212), (0, 187, 249), "nuclear")
          make_custom_icon("ic_nuclear_purple", (155, 93, 229), (247, 37, 133), "nuclear")
          make_custom_icon("ic_blackhole", (254, 228, 64), (155, 93, 229), "blackhole")
          make_custom_icon("ic_cyber_wechat", (0, 245, 212), (16, 185, 129), "chat")
          make_custom_icon("ic_cyber_game", (247, 37, 133), (254, 228, 64), "game")
          make_custom_icon("ic_cyber_video", (0, 187, 249), (247, 37, 133), "video")
          make_custom_icon("ic_cyber_github", (155, 93, 229), (0, 245, 212), "code")
          make_custom_icon("ic_cyber_camera", (254, 228, 64), (247, 37, 133), "camera")
          make_custom_icon("ic_cyber_music", (0, 245, 212), (155, 93, 229), "music")
          PYEOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NuclearWallpaper"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.i7ruhua.nuclearwallpaper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.i7ruhua.nuclearwallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0-ARGON-ICON-STUDIO"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">核芯壁纸引擎</string>
              <string name="icon_studio_name">核芯自定义图标包</string>
              <string name="wallpaper_desc">4 Argon 3.0 · 支持壁纸自由缩放平移、185Hz高刷与相册自定义图标包</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:settingsActivity="com.i7ruhua.nuclearwallpaper.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/appfilter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <iconback img1="icon_back" />
              <iconmask img1="icon_mask" />
              <iconupon img1="icon_upon" />
              <scale factor="0.78" />

              <item component="ComponentInfo{com.i7ruhua.nuclearwallpaper/com.i7ruhua.nuclearwallpaper.MainActivity}" drawable="ic_launcher" />
              <item component="ComponentInfo{com.tencent.mm/com.tencent.mm.ui.LauncherUI}" drawable="ic_cyber_wechat" />
              <item component="ComponentInfo{com.ss.android.ugc.aweme/com.ss.android.ugc.aweme.splash.SplashActivity}" drawable="ic_cyber_video" />
              <item component="ComponentInfo{com.kuaishou.nebula/com.yxcorp.gifshow.HomeActivity}" drawable="ic_cyber_video" />
              <item component="ComponentInfo{com.tencent.tmgp.sgame/com.tencent.tmgp.sgame.SGameActivity}" drawable="ic_cyber_game" />
              <item component="ComponentInfo{com.github.android/com.github.android.activities.MainActivity}" drawable="ic_cyber_github" />
              <item component="ComponentInfo{com.tencent.qqmusic/com.tencent.qqmusic.activity.AppStarterActivity}" drawable="ic_cyber_music" />
          </resources>
          EOF
          cp app/src/main/res/xml/appfilter.xml app/src/main/assets/appfilter.xml

          cat << 'EOF' > app/src/main/res/xml/drawable.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <version>1</version>
              <category title="核芯高定赛博图标" />
              <item drawable="ic_launcher" />
              <item drawable="ic_nuclear_cyan" />
              <item drawable="ic_nuclear_purple" />
              <item drawable="ic_blackhole" />
              <item drawable="ic_cyber_wechat" />
              <item drawable="ic_cyber_game" />
              <item drawable="ic_cyber_video" />
              <item drawable="ic_cyber_github" />
              <item drawable="ic_cyber_camera" />
              <item drawable="ic_cyber_music" />
              <item drawable="icon_back" />
          </resources>
          EOF
          cp app/src/main/res/xml/drawable.xml app/src/main/assets/drawable.xml

          cat << 'EOF' > app/src/main/res/values/icon_pack.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="icon_pack" translatable="false">
                  <item>ic_launcher</item>
                  <item>ic_nuclear_cyan</item>
                  <item>ic_nuclear_purple</item>
                  <item>ic_blackhole</item>
                  <item>ic_cyber_wechat</item>
                  <item>ic_cyber_game</item>
                  <item>ic_cyber_video</item>
                  <item>ic_cyber_github</item>
                  <item>ic_cyber_camera</item>
                  <item>ic_cyber_music</item>
                  <item>icon_back</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="true" />
              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- 专门响应一加 ColorOS 桌面图标包识别 & 单个图标自定义选图回调 -->
                  <activity
                      android:name=".IconPickerActivity"
                      android:exported="true"
                      android:label="@string/icon_studio_name">
                      <intent-filter>
                          <action android:name="org.adw.launcher.THEMES" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="org.adw.launcher.icons.ACTION_PICK_ICON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.novalauncher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.anddoes.launcher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.teslacoilsw.launcher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.gau.go.launcherex.theme" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NuclearWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/IconPickerActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class IconPickerActivity : AppCompatActivity() {

              // 0: 一加原生圆角, 1: 赛博霓虹边框, 2: 纯圆头像, 3: 无边框原图
              private var selectedShapeStyle = 1
              private val styleButtons = mutableListOf<Button>()

              private val pickGalleryIconLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      val bmp = createStyledIconFromUri(uri, selectedShapeStyle)
                      if (bmp != null) {
                          returnIconToLauncher(bmp, 0)
                      } else {
                          Toast.makeText(this, "图片解析失败，请换一张试试", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0F19")
                  window.navigationBarColor = Color.parseColor("#0B0F19")

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B0F19"))
                      isFillViewport = true
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(28), dp(20), dp(40))
                  }

                  val title = TextView(this).apply {
                      text = "🎨 核芯自定义图标工坊"
                      textSize = 22f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#00F5D4"))
                  }
                  val sub = TextView(this).apply {
                      text = "支持从手机相册任选图片秒变桌面图标，或直接选用下方高定赛博图标"
                      textSize = 13f
                      setTextColor(Color.parseColor("#8E9AAF"))
                      setPadding(0, dp(6), 0, dp(18))
                  }
                  root.addView(title)
                  root.addView(sub)

                  // 卡片 1：相册任意图片转图标
                  val customCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundedBg("#151C2C", dp(14))
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }

                  val stepTitle = TextView(this).apply {
                      text = "📸 第一步：选择相册图片裁切模具"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#00BBF9"))
                      setPadding(0, 0, 0, dp(10))
                  }
                  customCard.addView(stepTitle)

                  val styles = listOf(
                      0 to "一加原生圆角",
                      1 to "赛博霓虹框",
                      2 to "纯圆图标",
                      3 to "无裁切原图"
                  )
                  val styleGrid = GridLayout(this).apply {
                      columnCount = 2
                  }
                  for ((sId, sName) in styles) {
                      val btn = Button(this).apply {
                          text = sName
                          textSize = 13f
                          isAllCaps = false
                          val lp = GridLayout.LayoutParams().apply {
                              width = 0
                              height = dp(42)
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins(dp(4), dp(4), dp(4), dp(4))
                          }
                          layoutParams = lp
                          setOnClickListener {
                              selectedShapeStyle = sId
                              updateStyleButtonUI()
                          }
                      }
                      styleButtons.add(btn)
                      styleGrid.addView(btn)
                  }
                  updateStyleButtonUI()
                  customCard.addView(styleGrid)

                  val pickPhotoBtn = Button(this).apply {
                      text = "🖼️ 从手机相册任选一张图片生成图标"
                      textSize = 15.5f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#0B0F19"))
                      background = roundedBg("#00F5D4", dp(12))
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(14) }
                      layoutParams = lp
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      setOnClickListener {
                          pickGalleryIconLauncher.launch("image/*")
                      }
                  }
                  customCard.addView(pickPhotoBtn)
                  root.addView(customCard)

                  // 卡片 2：内置高定赛博图标库
                  val packCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundedBg("#151C2C", dp(14))
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(16) }
                      layoutParams = lp
                  }

                  val packHeader = TextView(this).apply {
                      text = "⚡ 或直接点击下方内置高定图标（点击即换）："
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#FEE440"))
                      setPadding(0, 0, 0, dp(12))
                  }
                  packCard.addView(packHeader)

                  val icons = listOf(
                      R.drawable.ic_launcher to "聚变核心",
                      R.drawable.ic_nuclear_cyan to "量子青核",
                      R.drawable.ic_nuclear_purple to "暗紫反应堆",
                      R.drawable.ic_blackhole to "引力黑洞",
                      R.drawable.ic_cyber_wechat to "赛博社交",
                      R.drawable.ic_cyber_game to "高刷电竞",
                      R.drawable.ic_cyber_video to "流光影音",
                      R.drawable.ic_cyber_github to "极客代码",
                      R.drawable.ic_cyber_camera to "全息影像",
                      R.drawable.ic_cyber_music to "声波律动",
                      R.drawable.icon_back to "純粹暗夜框"
                  )

                  val iconGrid = GridLayout(this).apply {
                      columnCount = 3
                  }

                  for ((resId, label) in icons) {
                      val cell = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          background = roundedBg("#1E2638", dp(12))
                          setPadding(dp(8), dp(12), dp(8), dp(10))
                          val lp = GridLayout.LayoutParams().apply {
                              width = 0
                              height = GridLayout.LayoutParams.WRAP_CONTENT
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins(dp(5), dp(5), dp(5), dp(5))
                          }
                          layoutParams = lp
                          setOnClickListener {
                              val raw = BitmapFactory.decodeResource(resources, resId)
                              val scaled = Bitmap.createScaledBitmap(raw, 240, 240, true)
                              returnIconToLauncher(scaled, resId)
                          }
                      }

                      val iv = ImageView(this).apply {
                          setImageResource(resId)
                          layoutParams = LinearLayout.LayoutParams(dp(58), dp(58))
                      }
                      val tv = TextView(this).apply {
                          text = label
                          textSize = 12f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setPadding(0, dp(6), 0, 0)
                      }
                      cell.addView(iv)
