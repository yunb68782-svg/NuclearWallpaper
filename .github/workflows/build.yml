              // 在线搜索（Wallhaven 主源 + Waifu/Unsplash 自动兜底，确保永远有样图展示）
              private fun fetchOnlineWallpapersWithFallback(query: String) {
                  onlineGrid.removeAllViews()
                  statusLabel.text = "🌐 正在搜索在线壁纸并生成预览卡: $query ..."
                  thread {
                      val results = mutableListOf<OnlineWallpaperItem>()
                      try {
                          val q = URLEncoder.encode(if (query.isEmpty()) "anime" else query, "UTF-8")
                          val api = "https://wallhaven.cc/api/v1/search?q=$q&purity=100&sorting=toplist&topRange=1M"
                          val conn = (URL(api).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 6000; readTimeout = 6000
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                          }
                          val json = conn.inputStream.bufferedReader().readText()
                          val data = JSONObject(json).getJSONArray("data")
                          for (i in 0 until minOf(6, data.length())) {
                              val obj = data.getJSONObject(i)
                              val resStr = obj.optString("resolution", "4K高清")
                              val thumb = obj.getJSONObject("thumbs").getString("small")
                              val full = obj.getString("path")
                              results.add(OnlineWallpaperItem("精选壁纸 #$i ($resStr)", thumb, full, false, "🖼️ $resStr"))
                          }
                      } catch (_: Exception) {}

                      // 如果主源超时，自动启用免梯高速动漫/高清壁纸源兜底，绝不空白
                      if (results.isEmpty()) {
                          try {
                              val conn = (URL("https://api.waifu.im/search?included_tags=waifu&many=true").openConnection() as HttpURLConnection).apply {
                                  connectTimeout = 6000; readTimeout = 6000
                                  setRequestProperty("User-Agent", "Mozilla/5.0")
                              }
                              val arr: JSONArray = JSONObject(conn.inputStream.bufferedReader().readText()).getJSONArray("images")
                              for (i in 0 until minOf(6, arr.length())) {
                                  val obj = arr.getJSONObject(i)
                                  val url = obj.getString("url")
                                  val w = obj.optInt("width", 1080)
                                  val h = obj.optInt("height", 1920)
                                  results.add(OnlineWallpaperItem("二次元高定 #${i + 1}", url, url, false, "🖼️ ${w}x${h}"))
                              }
                          } catch (_: Exception) {}
                      }

                      runOnUiThread {
                          if (results.isNotEmpty()) {
                              renderOnlineCards(results)
                          } else {
                              statusLabel.text = "⚠️ 在线搜索超时，已为您展示内置精选动态视频壁纸库"
                              renderOnlineCards(curatedDynamicVideos)
                          }
                      }
                  }
              }

              private fun downloadBitmap(urlStr: String): Bitmap? = try {
                  val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 7000; readTimeout = 7000
                      setRequestProperty("User-Agent", "Mozilla/5.0")
                  }
                  conn.inputStream.use { BitmapFactory.decodeStream(it) }
              } catch (_: Exception) { null }

              private fun createStylizedPlaceholder(title: String, accent: Int): Bitmap {
                  val bmp = Bitmap.createBitmap(320, 200, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.shader = LinearGradient(0f, 0f, 320f, 200f, Color.parseColor("#141B2B"), Color.parseColor("#070A12"), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, 320f, 200f, p)
                  p.shader = null
                  p.color = accent
                  p.alpha = 55
                  c.drawCircle(260f, 50f, 70f, p)
                  p.alpha = 220
                  p.textSize = 24f
                  p.textAlign = Paint.Align.CENTER
                  c.drawText(title.take(8), 160f, 105f, p)
                  return bmp
              }

              // 1:1 物理对齐的 360° 旋转 + 四周裁切 + 实时预览自定义 View（读取当前壁纸专属参数）
              inner class LiveStylePreviewView(ctx: Context) : View(ctx) {
                  private var previewBmp: Bitmap? = null
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  private val framePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE; strokeWidth = dp(2).toFloat(); color = Color.parseColor("#00F5D4")
                  }
                  private val cropBorderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE; strokeWidth = dp(1.5f).toFloat(); color = Color.parseColor("#FEE440")
                  }
                  private val dashPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE; strokeWidth = dp(1).toFloat(); color = Color.parseColor("#77FFFFFF")
                      pathEffect = DashPathEffect(floatArrayOf(10f, 8f), 0f)
                  }
                  private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#CCFFFFFF"); textSize = dp(10).toFloat(); textAlign = Paint.Align.CENTER
                  }
                  private val outerClip = Path()
                  private var lastX = 0f
                  private var lastY = 0f

                  init { reloadPreviewBitmap() }

                  fun reloadPreviewBitmap() {
                      previewBmp?.recycle(); previewBmp = null
                      val f = currentFile()
                      if (f != null) {
                          try {
                              if (f.name.endsWith(".mp4")) {
                                  val mmr = MediaMetadataRetriever()
                                  mmr.setDataSource(f.absolutePath)
                                  previewBmp = mmr.getFrameAtTime(0)
                                  mmr.release()
                              } else {
                                  previewBmp = BitmapFactory.decodeFile(f.absolutePath, BitmapFactory.Options().apply { inSampleSize = 2 })
                              }
                          } catch (_: Exception) {}
                      }
                      invalidate()
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      val f = currentFile()
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              parent?.requestDisallowInterceptTouchEvent(true)
                              lastX = event.x; lastY = event.y
                              return true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.x - lastX) / width.coerceAtLeast(1)
                              val dy = (event.y - lastY) / height.coerceAtLeast(1)
                              lastX = event.x; lastY = event.y
                              val nextX = (getFileParam(f, "pan_x", 50) + (dx * 100).toInt()).coerceIn(0, 100)
                              val nextY = (getFileParam(f, "pan_y", 50) + (dy * 100).toInt()).coerceIn(0, 100)
                              panXSeek.progress = nextX
                              panYSeek.progress = nextY
                              invalidate()
                              return true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> parent?.requestDisallowInterceptTouchEvent(false)
                      }
                      return super.onTouchEvent(event)
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat(); val h = height.toFloat()
                      val rect = RectF(4f, 4f, w - 4f, h - 4f)
                      outerClip.reset()
                      outerClip.addRoundRect(rect, dp(16).toFloat(), dp(16).toFloat(), Path.Direction.CW)

                      canvas.save()
                      canvas.clipPath(outerClip)
                      canvas.drawColor(Color.parseColor("#070A12"))

                      val f = currentFile()
                      val zoom = (getFileParam(f, "zoom", 100) / 100f).coerceIn(0.3f, 3.0f)
                      val rot = getFileParam(f, "rotate", 0).toFloat()
                      val crop = (getFileParam(f, "crop", 0) / 100f).coerceIn(0f, 0.42f)
                      val panX = (getFileParam(f, "pan_x", 50) - 50) / 100f
                      val panY = (getFileParam(f, "pan_y", 50) - 50) / 100f
                      val cx = (0.5f + panX) * w
                      val cy = (0.5f + panY) * h

                      val bmp = previewBmp
                      if (bmp != null && bmp.width > 0 && bmp.height > 0) {
                          val mAspect = bmp.width.toFloat() / bmp.height.toFloat()
                          val bw = w * zoom
                          val bh = (w / mAspect) * zoom

                          canvas.save()
                          canvas.translate(cx, cy)
                          canvas.rotate(rot)

                          val halfW = bw * (0.5f - crop)
                          val halfH = bh * (0.5f - crop)
                          val cropRect = RectF(-halfW, -halfH, halfW, halfH)
                          canvas.clipRect(cropRect)
                          canvas.drawBitmap(bmp, null, RectF(-bw * 0.5f, -bh * 0.5f, bw * 0.5f, bh * 0.5f), paint)
                          canvas.drawRect(cropRect, cropBorderPaint)
                          canvas.restore()
                      } else {
                          canvas.drawText("请先添加本地壁纸或点击下方卡片试看下载", w * 0.5f, h * 0.5f, textPaint)
                      }

                      canvas.drawRoundRect(RectF(w * 0.08f, h * 0.08f, w * 0.92f, h * 0.24f), dp(8).toFloat(), dp(8).toFloat(), dashPaint)
                      for (r in 0..2) for (c in 0..3) {
                          val ix = w * (0.14f + c * 0.22f); val iy = h * (0.33f + r * 0.13f)
                          canvas.drawRoundRect(RectF(ix, iy, ix + w * 0.12f, iy + w * 0.12f), dp(4).toFloat(), dp(4).toFloat(), dashPaint)
                      }
                      canvas.drawText("当前壁纸专属 · 缩放:${(zoom*100).toInt()}% | 旋转:${rot.toInt()}° | 裁切:${(crop*100).toInt()}%", w * 0.5f, h * 0.93f, textPaint)
                      canvas.restore()
                      canvas.drawRoundRect(rect, dp(16).toFloat(), dp(16).toFloat(), framePaint)
                  }
              }

              private fun getIntervalName(m: Int) = when (m) { 0 -> "单张固定"; 1 -> "每次回桌面切换"; 2 -> "每1分钟"; else -> "每5分钟" }
              private fun simpleSeek(onChange: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { onChange(p) }
                  override fun onStartTrackingTouch(s: SeekBar?) {}
                  override fun onStopTrackingTouch(s: SeekBar?) {}
              }
              private fun createSectionCard(title: String) = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; background = roundedBg("#141B2B", dp(12))
                  setPadding(dp(14), dp(14), dp(14), dp(14))
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(12) }
                  addView(TextView(this@MainActivity).apply {
                      text = title; textSize = 14f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#00BBF9")); setPadding(0, 0, 0, dp(6))
                  })
              }
              private fun createSwitchRow(label: String, key: String, defVal: Boolean) = Switch(this).apply {
                  text = label; textSize = 13f; setTextColor(Color.WHITE)
                  isChecked = prefs.getBoolean(key, defVal); setPadding(0, dp(7), 0, dp(7))
                  setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean(key, isChecked).apply() }
              }
              private fun copyUriToFile(uri: Uri, outFile: File): Boolean = try {
                  contentResolver.openInputStream(uri)?.use { inp -> FileOutputStream(outFile).use { out -> inp.copyTo(out) } }
                  true
              } catch (_: Exception) { false }
              private fun roundedBg(hex: String, r: Int) = GradientDrawable().apply { cornerRadius = r.toFloat(); setColor(Color.parseColor(hex)) }
              private fun dp(v: Number) = (v.toFloat() * resources.displayMetrics.density).toInt()
          }
