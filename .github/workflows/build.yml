                  dialog.setContentView(root)
                  dialog.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  dialog.window?.setLayout(dp(320), ViewGroup.LayoutParams.WRAP_CONTENT)
                  dialog.setOnDismissListener {
                      dialogClosed = true
                      try { videoView.stopPlayback() } catch (_: Exception) {}
                  }
                  dialog.show()

                  thread {
                      try {
                          val ext = if (item.isVideo) "mp4" else "jpg"
                          val tempFile = File(cacheDir, "preview_temp_${System.currentTimeMillis()}.$ext")
                          if (item.isBuiltinAsset) {
                              assets.open(item.mediaAssetOrUrl).use { inp ->
                                  FileOutputStream(tempFile).use { out -> inp.copyTo(out) }
                              }
                          } else {
                              val tb = downloadBitmap(item.thumbAssetOrUrl)
                              if (tb != null && !dialogClosed) {
                                  runOnUiThread { thumbImg.setImageBitmap(tb) }
                              }
                              val conn = (URL(item.mediaAssetOrUrl).openConnection() as HttpURLConnection).apply {
                                  connectTimeout = 10000; readTimeout = 15000
                                  setRequestProperty("User-Agent", "Mozilla/5.0")
                              }
                              val totalLen = conn.contentLength
                              conn.inputStream.use { inp ->
                                  FileOutputStream(tempFile).use { out ->
                                      val buf = ByteArray(8192)
                                      var read: Int
                                      var sum = 0L
                                      while (inp.read(buf).also { read = it } != -1) {
                                          if (dialogClosed) break
                                          out.write(buf, 0, read)
                                          sum += read
                                          runOnUiThread {
                                              if (totalLen > 0) {
                                                  val pct = ((sum * 100) / totalLen).coerceIn(1, 99)
                                                  subStatus.text = "⏳ 正在下载原文件: $pct% (${String.format("%.1f", sum / 1048576f)} MB)"
                                              } else {
                                                  subStatus.text = "⏳ 已下载: ${String.format("%.2f", sum / 1048576f)} MB..."
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          if (dialogClosed) {
                              tempFile.delete()
                              return@thread
                          }

                          if (!WallpaperConfig.isMediaFileValid(tempFile, item.isVideo)) {
                              tempFile.delete()
                              runOnUiThread {
                                  progressBar.visibility = View.GONE
                                  subStatus.text = "⚠️ 该壁纸源连接中断或文件不完整，请换一张"
                              }
                              return@thread
                          }

                          cachedPreviewFile = tempFile
                          runOnUiThread {
                              progressBar.visibility = View.GONE
                              if (item.isVideo) {
                                  scaleToggleBtn.visibility = View.GONE
                                  subStatus.text = "✅ 60fps 动态视频实时播放中（满意请点右下角应用）"
                                  videoView.visibility = View.VISIBLE
                                  videoView.setVideoPath(tempFile.absolutePath)
                                  videoView.setOnPreparedListener { mp ->
                                      mp.isLooping = true
                                      mp.setVolume(0f, 0f)
                                      thumbImg.visibility = View.GONE
                                      videoView.start()
                                  }
                                  videoView.setOnErrorListener { _, _, _ ->
                                      subStatus.text = "⚠️ 该视频编码不支持直接预览，请换一张"
                                      Toast.makeText(this@MainActivity, "该视频源失效，请换一个", Toast.LENGTH_SHORT).show()
                                      true
                                  }
                              } else {
                                  val fullBmp = BitmapFactory.decodeFile(tempFile.absolutePath)
                                  if (fullBmp != null) {
                                      thumbImg.scaleType = if (isCropPreview) ImageView.ScaleType.CENTER_CROP else ImageView.ScaleType.FIT_CENTER
                                      thumbImg.setImageBitmap(fullBmp)
                                  }
                                  subStatus.text = "✅ 高清原图就绪（可点右上角切换铺满/全显）"
                              }
                          }
                      } catch (e: Exception) {
                          if (!dialogClosed) {
                              runOnUiThread {
                                  progressBar.visibility = View.GONE
                                  subStatus.text = "⚠️ 网络请求超时，请重试或切换其他壁纸"
                              }
                          }
                      }
                  }
              }

              private fun fetchOnlineWallpapers(query: String, labelName: String) {
                  val mySeq = ++searchSeq
                  onlineGrid.removeAllViews()
                  onlineLoadingBar.visibility = View.VISIBLE
                  onlineSectionStatus.text = "🔄 正在为您搜索【$labelName】高清壁纸..."
                  statusLabel.text = "🌐 正在搜索在线壁纸: $query ..."

                  thread {
                      val results = mutableListOf<OnlineWallpaperItem>()
                      try {
                          val q = URLEncoder.encode(if (query.isEmpty()) "anime" else query, "UTF-8")
                          val api = "https://wallhaven.cc/api/v1/search?q=$q&purity=100&sorting=relevance"
                          val conn = (URL(api).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 6000; readTimeout = 6000
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                          }
                          val json = conn.inputStream.bufferedReader().readText()
                          val data = JSONObject(json).getJSONArray("data")
                          for (i in 0 until minOf(6, data.length())) {
                              val obj = data.getJSONObject(i)
                              val resStr = obj.optString("resolution", "4K高清")
                              val thumb = obj.getJSONObject("thumbs").getString("small")
                              val full = obj.getString("path")
                              results.add(OnlineWallpaperItem("$labelName #${i + 1}", thumb, full, false, false, "🖼️ $resStr"))
                          }
                      } catch (_: Exception) {}

                      if (results.isEmpty()) {
                          try {
                              val conn = (URL("https://api.waifu.im/search?included_tags=waifu&many=true").openConnection() as HttpURLConnection).apply {
                                  connectTimeout = 6000; readTimeout = 6000
                                  setRequestProperty("User-Agent", "Mozilla/5.0")
                              }
                              val arr: JSONArray = JSONObject(conn.inputStream.bufferedReader().readText()).getJSONArray("images")
                              for (i in 0 until minOf(6, arr.length())) {
                                  val obj = arr.getJSONObject(i)
                                  val url = obj.getString("url")
                                  val w = obj.optInt("width", 1080)
                                  val h = obj.optInt("height", 1920)
                                  results.add(OnlineWallpaperItem("$labelName #${i + 1}", url, url, false, false, "🖼️ ${w}x${h}"))
                              }
                          } catch (_: Exception) {}
                      }

                      runOnUiThread {
                          if (mySeq != searchSeq) return@runOnUiThread
                          onlineLoadingBar.visibility = View.GONE
                          if (results.isNotEmpty()) {
                              onlineSectionStatus.text = "✅ 【$labelName】加载完成（共 ${results.size} 张，点击任意卡片弹窗试看）"
                              statusLabel.text = "✅ 已加载【$labelName】，点击缩略图即可弹窗预览"
                              renderOnlineCards(results)
                          } else {
                              onlineSectionStatus.text = "⚠️ 在线图库连接超时，已为您切回内置 60fps 动态视频库"
                              highlightChannelTab("__DYNAMIC_VIDEOS__")
                              renderOnlineCards(builtinDynamicVideos)
                          }
                      }
                  }
              }

              private fun downloadBitmap(urlStr: String): Bitmap? = try {
                  val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 7000; readTimeout = 7000
                      setRequestProperty("User-Agent", "Mozilla/5.0")
                  }
                  conn.inputStream.use { BitmapFactory.decodeStream(it) }
              } catch (_: Exception) { null }

              private fun getIntervalName(m: Int) = when (m) { 0 -> "单张固定"; 1 -> "每次回桌面切换"; 2 -> "每1分钟"; else -> "每5分钟" }
              private fun simpleSeek(onChange: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { onChange(p) }
                  override fun onStartTrackingTouch(s: SeekBar?) {}
                  override fun onStopTrackingTouch(s: SeekBar?) {}
              }
              private fun createSectionCard(title: String) = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; background = roundedBg("#141B2B", dp(12))
                  setPadding(dp(14), dp(14), dp(14), dp(14))
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(12) }
                  addView(TextView(this@MainActivity).apply {
                      text = title; textSize = 14f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#00BBF9")); setPadding(0, 0, 0, dp(6))
                  })
              }
              private fun createSwitchRow(label: String, key: String, defVal: Boolean) = Switch(this).apply {
                  text = label; textSize = 13f; setTextColor(Color.WHITE)
                  isChecked = prefs.getBoolean(key, defVal); setPadding(0, dp(7), 0, dp(7))
                  setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean(key, isChecked).apply() }
              }
              private fun copyUriToFile(uri: Uri, outFile: File): Boolean = try {
                  contentResolver.openInputStream(uri)?.use { inp -> FileOutputStream(outFile).use { out -> inp.copyTo(out) } }
                  true
              } catch (_: Exception) { false }
              private fun roundedBg(hex: String, r: Int) = GradientDrawable().apply { cornerRadius = r.toFloat(); setColor(Color.parseColor(hex)) }
              private fun dp(v: Number) = (v.toFloat() * resources.displayMetrics.density).toInt()
          }
