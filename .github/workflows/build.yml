              // ==================== 单张壁纸独立参数读写核心逻辑 ====================
              private fun currentFile(): File? {
                  val list = getPlaylistFiles()
                  if (list.isEmpty()) return null
                  val idx = prefs.getInt("playlist_index", 0).coerceIn(0, list.size - 1)
                  return list[idx]
              }

              private fun getFileParam(file: File?, attr: String, defVal: Int): Int {
                  if (file == null) return prefs.getInt("default_$attr", defVal)
                  val key = "cfg_${file.name}_$attr"
                  return if (prefs.contains(key)) prefs.getInt(key, defVal) else prefs.getInt(attr, defVal)
              }

              private fun setFileParam(file: File?, attr: String, value: Int) {
                  val editor = prefs.edit()
                  if (file == null) {
                      editor.putInt("default_$attr", value)
                  } else {
                      editor.putInt("cfg_${file.name}_$attr", value)
                  }
                  editor.putInt("transform_tick", prefs.getInt("transform_tick", 0) + 1)
                  editor.apply()
              }

              private fun clearFileConfig(file: File) {
                  prefs.edit()
                      .remove("cfg_${file.name}_zoom")
                      .remove("cfg_${file.name}_rotate")
                      .remove("cfg_${file.name}_crop")
                      .remove("cfg_${file.name}_pan_x")
                      .remove("cfg_${file.name}_pan_y")
                      .apply()
              }

              private fun syncSlidersToCurrentFile() {
                  isSyncingSliders = true
                  val f = currentFile()
                  val z = getFileParam(f, "zoom", 100)
                  val r = getFileParam(f, "rotate", 0)
                  val c = getFileParam(f, "crop", 0)
                  val px = getFileParam(f, "pan_x", 50)
                  val py = getFileParam(f, "pan_y", 50)

                  zoomSeek.progress = (z - 30).coerceIn(0, 270)
                  rotateSeek.progress = r.coerceIn(0, 360)
                  cropSeek.progress = c.coerceIn(0, 40)
                  panXSeek.progress = px.coerceIn(0, 100)
                  panYSeek.progress = py.coerceIn(0, 100)

                  zoomText.text = "🔍 画面缩放大小：$z%（100%为横屏全显，右滑放大铺满）"
                  rotateText.text = "🔄 360° 旋转角度：${r}°"
                  cropText.text = "✂️ 四周边缘裁切：$c%（可裁掉视频/图片四周黑边或水印）"

                  if (f != null) {
                      val list = getPlaylistFiles()
                      val idx = prefs.getInt("playlist_index", 0).coerceIn(0, (list.size - 1).coerceAtLeast(0))
                      val tag = if (f.name.endsWith(".mp4")) "🎬动态视频" else "🖼️静态图片"
                      currentFileTagLabel.text = "📌 正在独立调节：第 ${idx + 1} 张 ($tag) 的专属尺寸，不影响其他壁纸"
                  } else {
                      currentFileTagLabel.text = "📌 当前轮播池为空，请先添加本地壁纸或从下方在线库试看下载"
                  }
                  isSyncingSliders = false
              }

              private fun deleteCurrentPlaylistItem() {
                  val f = currentFile()
                  if (f == null) {
                      Toast.makeText(this, "当前没有可删除的壁纸", Toast.LENGTH_SHORT).show()
                      return
                  }
                  clearFileConfig(f)
                  f.delete()
                  val remaining = getPlaylistFiles()
                  val nextIdx = prefs.getInt("playlist_index", 0).coerceIn(0, (remaining.size - 1).coerceAtLeast(0))
                  prefs.edit().putInt("playlist_index", nextIdx).apply()
                  bumpMediaVersion()
                  syncSlidersToCurrentFile()
                  previewCanvas.reloadPreviewBitmap()
                  updatePlaylistLabel()
                  Toast.makeText(this, "已删除该壁纸及其专属配置", Toast.LENGTH_SHORT).show()
              }

              private fun migrateLegacyFilesIfNeed() {
                  if (getPlaylistFiles().isEmpty()) {
                      val oldImg = File(filesDir, "custom_image.jpg")
                      val oldVid = File(filesDir, "custom_video.mp4")
                      if (oldVid.exists()) oldVid.copyTo(File(playlistDir, "item_init.mp4"), true)
                      else if (oldImg.exists()) oldImg.copyTo(File(playlistDir, "item_init.jpg"), true)
                  }
              }

              private fun getPlaylistFiles(): List<File> {
                  return playlistDir.listFiles()?.filter { it.isFile && (it.name.endsWith(".jpg") || it.name.endsWith(".mp4")) }
                      ?.sortedBy { it.name } ?: emptyList()
              }

              private fun selectPlaylistIndex(idx: Int) {
                  val list = getPlaylistFiles()
                  if (list.isEmpty()) return
                  val safeIdx = ((idx % list.size) + list.size) % list.size
                  prefs.edit().putInt("playlist_index", safeIdx).apply()
                  bumpMediaVersion()
                  syncSlidersToCurrentFile()
                  previewCanvas.reloadPreviewBitmap()
                  updatePlaylistLabel()
              }

              private fun stepPlaylist(delta: Int) {
                  val list = getPlaylistFiles()
                  if (list.isEmpty()) {
                      Toast.makeText(this, "轮播池为空，请先添加图片或视频", Toast.LENGTH_SHORT).show()
                      return
                  }
                  selectPlaylistIndex(prefs.getInt("playlist_index", 0) + delta)
              }

              private fun updatePlaylistLabel() {
                  val list = getPlaylistFiles()
                  if (list.isEmpty()) {
                      playlistInfoLabel.text = "当前轮播池：0 个文件（请添加本地壁纸或点击下方在线卡片试看下载）"
                  } else {
                      val idx = (prefs.getInt("playlist_index", 0)).coerceIn(0, list.size - 1)
                      val f = list[idx]
                      val type = if (f.name.endsWith(".mp4")) "🎬视频" else "🖼️图片"
                      val z = getFileParam(f, "zoom", 100)
                      val r = getFileParam(f, "rotate", 0)
                      playlistInfoLabel.text = "当前轮播池：共 ${list.size} 个 | 第 ${idx + 1}/${list.size} 个 ($type · 专属缩放${z}% / ${r}°)"
                  }
              }

              private fun bumpMediaVersion() {
                  prefs.edit().putInt("media_version", prefs.getInt("media_version", 0) + 1).apply()
              }

              // ==================== 在线壁纸卡片渲染 + 弹窗实时预览（绝不直接盲下） ====================
              private fun renderOnlineCards(items: List<OnlineWallpaperItem>) {
                  onlineGrid.removeAllViews()
                  statusLabel.text = "✅ 已加载 ${items.size} 款壁纸样图，点击任意卡片即可弹窗预览动态/高清效果"

                  items.forEach { item ->
                      val card = FrameLayout(this).apply {
                          background = roundedBg("#1E2638", dp(10))
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0; height = dp(145)
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins(dp(5), dp(5), dp(5), dp(5))
                          }
                      }

                      // 先绘制精美的赛博渐变占位底图，随后异步加载真实样图覆盖
                      val coverView = ImageView(this).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setImageBitmap(createStylizedPlaceholder(item.title, item.accentColor))
                          layoutParams = FrameLayout.LayoutParams(-1, -1)
                      }
                      card.addView(coverView)

                      // 左上角类型角标 (🎬动态视频 / 🖼️4K超清)
                      val badgeTv = TextView(this).apply {
                          text = item.badge
                          textSize = 10.5f; setTextColor(Color.parseColor("#0B0F19")); typeface = Typeface.DEFAULT_BOLD
                          background = roundedBg(if (item.isVideo) "#00F5D4" else "#FEE440", dp(6))
                          setPadding(dp(6), dp(2), dp(6), dp(2))
                          layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START).apply {
                              setMargins(dp(6), dp(6), 0, 0)
                          }
                      }
                      card.addView(badgeTv)

                      // 底部半透明标题条 + “点击试看”提示
                      val bottomBar = TextView(this).apply {
                          text = "${item.title}  [点我试看]"
                          textSize = 11f; setTextColor(Color.WHITE); maxLines = 1
                          setBackgroundColor(Color.parseColor("#B80B0F19"))
                          setPadding(dp(8), dp(5), dp(8), dp(5))
                          layoutParams = FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM)
                      }
                      card.addView(bottomBar)

                      // 点击卡片 -> 弹出预览窗，而不是直接下载！
                      card.setOnClickListener { showInteractivePreviewDialog(item) }
                      onlineGrid.addView(card)

                      // 异步加载真实封面缩略图
                      thread {
                          val bmp = downloadBitmap(item.thumbUrl)
                          if (bmp != null) {
                              runOnUiThread { coverView.setImageBitmap(bmp) }
                          }
                      }
                  }
              }

              // 弹窗预览核心：支持动态视频实时循环播放预览 & 高清大图预览，满意再入库
              private fun showInteractivePreviewDialog(item: OnlineWallpaperItem) {
