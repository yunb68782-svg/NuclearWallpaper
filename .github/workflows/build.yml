name: Build Nuclear Wallpaper 4.0 Live Preview & Icon Studio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate 4.0 Project & Icon Pack
        run: |
          pip install pillow
          mkdir -p app/src/main/java/com/i7ruhua/nuclearwallpaper
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/assets

          python3 - << 'PYEOF'
          import math
          from PIL import Image, ImageDraw, ImageFilter

          OUT = "app/src/main/res/drawable-nodpi"
          S = 512

          def base_box(c1, c2, border, glow):
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              grad = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              gd = ImageDraw.Draw(grad)
              for y in range(S):
                  t = y / float(S)
                  col = tuple(int(c1[i] * (1 - t) + c2[i] * t) for i in range(3)) + (248,)
                  gd.line([(0, y), (S, y)], fill=col)
              mask = Image.new("L", (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=255)
              img.paste(grad, (0, 0), mask)
              g = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              ImageDraw.Draw(g).ellipse([96, 96, S - 96, S - 96], fill=glow + (80,))
              img = Image.alpha_composite(img, g.filter(ImageFilter.GaussianBlur(40)))
              ImageDraw.Draw(img).rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=border, width=8)
              return img

          base_box((16, 23, 41), (8, 11, 22), (0, 245, 212, 190), (123, 44, 191)).save(f"{OUT}/icon_back.png")

          upon = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(upon).rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=(0, 245, 212, 230), width=7)
          upon.save(f"{OUT}/icon_upon.png")

          mask_img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(mask_img).rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=(255, 255, 255, 255))
          mask_img.save(f"{OUT}/icon_mask.png")

          def make_icon(name, a1, a2, kind):
              b = base_box((18, 25, 46), (7, 10, 20), a1 + (235,), a2)
              ly = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(ly)
              cx = cy = S // 2
              if kind == "nuc":
                  for ang in [0, 60, 120]:
                      r = math.radians(ang)
                      pts = [(cx + 155*math.cos(math.radians(t))*math.cos(r) - 58*math.sin(math.radians(t))*math.sin(r),
                              cy + 155*math.cos(math.radians(t))*math.sin(r) + 58*math.sin(math.radians(t))*math.cos(r)) for t in range(0, 360, 6)]
                      d.polygon(pts, outline=a1 + (240,), width=10)
                  d.ellipse([cx-38, cy-38, cx+38, cy+38], fill=a2+(255,), outline=(255,255,255,245), width=5)
              elif kind == "bh":
                  for r, c, w in [(145, a2, 11), (110, a1, 15), (80, (255,230,120), 9)]:
                      d.ellipse([cx-r, cy-r, cx+r, cy+r], outline=c+(235,), width=w)
                  d.ellipse([cx-55, cy-55, cx+55, cy+55], fill=(5,7,15,255))
              elif kind == "chat":
                  d.rounded_rectangle([122, 142, 390, 348], radius=65, fill=a1+(50,), outline=a1+(245,), width=12)
                  for x in [195, 256, 317]:
                      d.ellipse([x-15, 228, x+15, 258], fill=(255,255,255,245))
              elif kind == "game":
                  d.polygon([(cx, 118), (388, cy), (cx, 394), (124, cy)], fill=a2+(55,), outline=a1+(245,), width=12)
                  d.ellipse([cx-42, cy-42, cx+42, cy+42], fill=a1+(245,))
              elif kind == "vid":
                  d.rounded_rectangle([118, 138, 394, 374], radius=54, fill=a2+(50,), outline=a1+(245,), width=12)
                  d.polygon([(215, 192), (215, 320), (328, 256)], fill=(255,255,255,248))
              elif kind == "code":
                  d.arc([128, 128, 384, 384], 0, 360, fill=a1+(245,), width=12)
                  d.line([(275, 195), (237, 317)], fill=a2+(255,), width=12)
              out = Image.alpha_composite(b, ly.filter(ImageFilter.GaussianBlur(9)))
              Image.alpha_composite(out, ly).save(f"{OUT}/{name}.png")

          make_icon("ic_launcher", (0,245,212), (247,37,133), "nuc")
          make_icon("ic_nuclear_cyan", (0,245,212), (0,187,249), "nuc")
          make_icon("ic_blackhole", (254,228,64), (155,93,229), "bh")
          make_icon("ic_cyber_wechat", (0,245,212), (16,185,129), "chat")
          make_icon("ic_cyber_game", (247,37,133), (254,228,64), "game")
          make_icon("ic_cyber_video", (0,187,249), (247,37,133), "vid")
          make_icon("ic_cyber_github", (155,93,229), (0,245,212), "code")
          PYEOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NuclearWallpaper"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.i7ruhua.nuclearwallpaper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.i7ruhua.nuclearwallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-ARGON-PREVIEW"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">核芯壁纸引擎</string>
              <string name="icon_studio_name">核芯自定义图标包</string>
              <string name="wallpaper_desc">4 Argon 4.0 · 实时大小预览窗 + 185Hz高刷 + 一加图标包</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:settingsActivity="com.i7ruhua.nuclearwallpaper.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/appfilter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <iconback img1="icon_back" />
              <iconmask img1="icon_mask" />
              <iconupon img1="icon_upon" />
              <scale factor="0.78" />
              <item component="ComponentInfo{com.i7ruhua.nuclearwallpaper/com.i7ruhua.nuclearwallpaper.MainActivity}" drawable="ic_launcher" />
              <item component="ComponentInfo{com.tencent.mm/com.tencent.mm.ui.LauncherUI}" drawable="ic_cyber_wechat" />
              <item component="ComponentInfo{com.ss.android.ugc.aweme/com.ss.android.ugc.aweme.splash.SplashActivity}" drawable="ic_cyber_video" />
              <item component="ComponentInfo{com.tencent.tmgp.sgame/com.tencent.tmgp.sgame.SGameActivity}" drawable="ic_cyber_game" />
              <item component="ComponentInfo{com.github.android/com.github.android.activities.MainActivity}" drawable="ic_cyber_github" />
          </resources>
          EOF
          cp app/src/main/res/xml/appfilter.xml app/src/main/assets/appfilter.xml

          cat << 'EOF' > app/src/main/res/xml/drawable.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <version>1</version>
              <category title="核芯高定图标" />
              <item drawable="ic_launcher" />
              <item drawable="ic_nuclear_cyan" />
              <item drawable="ic_blackhole" />
              <item drawable="ic_cyber_wechat" />
              <item drawable="ic_cyber_game" />
              <item drawable="ic_cyber_video" />
              <item drawable="ic_cyber_github" />
              <item drawable="icon_back" />
          </resources>
          EOF
          cp app/src/main/res/xml/drawable.xml app/src/main/assets/drawable.xml

          cat << 'EOF' > app/src/main/res/values/icon_pack.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="icon_pack" translatable="false">
                  <item>ic_launcher</item>
                  <item>ic_nuclear_cyan</item>
                  <item>ic_blackhole</item>
                  <item>ic_cyber_wechat</item>
                  <item>ic_cyber_game</item>
                  <item>ic_cyber_video</item>
                  <item>ic_cyber_github</item>
                  <item>icon_back</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true" android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".IconPickerActivity" android:exported="true" android:label="@string/icon_studio_name">
                      <intent-filter>
                          <action android:name="org.adw.launcher.THEMES" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="org.adw.launcher.icons.ACTION_PICK_ICON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.novalauncher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.anddoes.launcher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NuclearWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/IconPickerActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.Activity
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class IconPickerActivity : AppCompatActivity() {
              private var shapeStyle = 1
              private val styleBtns = mutableListOf<Button>()

              private val pickPhoto = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      val bmp = makeIconBitmap(uri, shapeStyle)
                      if (bmp != null) sendIconResult(bmp, 0)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0F19")
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0B0F19")); isFillViewport = true }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(18), dp(24), dp(18), dp(36)) }

                  root.addView(TextView(this).apply {
                      text = "🎨 一加 ColorOS 自定义图标工坊"
                      textSize = 21f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#00F5D4"))
                  })

                  val card1 = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = rBg("#151C2C", dp(14)); setPadding(dp(14), dp(14), dp(14), dp(14))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(14) }
                  }
                  card1.addView(TextView(this).apply {
                      text = "📸 第一步：选择裁切形状 ➔ 从相册选图当图标"; textSize = 14f; setTextColor(Color.parseColor("#00BBF9"))
                  })

                  val gridStyle = GridLayout(this).apply { columnCount = 2 }
                  listOf(0 to "一加圆角", 1 to "霓虹发光框", 2 to "纯圆头像", 3 to "无裁切原图").forEach { (id, name) ->
                      val b = Button(this).apply {
                          text = name; textSize = 12.5f; isAllCaps = false
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0; height = dp(40); columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins(dp(4), dp(6), dp(4), dp(4))
                          }
                          setOnClickListener { shapeStyle = id; refreshStyleUI() }
                      }
                      styleBtns.add(b); gridStyle.addView(b)
                  }
                  refreshStyleUI()
                  card1.addView(gridStyle)

                  card1.addView(Button(this).apply {
                      text = "🖼️ 从手机相册任选图片生成桌面图标"
                      textSize = 15f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#0B0F19"))
                      background = rBg("#00F5D4", dp(12))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(12) }
                      setOnClickListener { pickPhoto.launch("image/*") }
                  })
                  root.addView(card1)

                  val card2 = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = rBg("#151C2C", dp(14)); setPadding(dp(14), dp(14), dp(14), dp(14))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(14) }
                  }
                  card2.addView(TextView(this).apply {
                      text = "⚡ 或直接点击下方内置高定图标（点击即换）："; textSize = 14f; setTextColor(Color.parseColor("#FEE440"))
                  })

                  val iconGrid = GridLayout(this).apply { columnCount = 4 }
                  listOf(
                      R.drawable.ic_launcher to "聚变核", R.drawable.ic_nuclear_cyan to "量子青",
                      R.drawable.ic_blackhole to "黑洞", R.drawable.ic_cyber_wechat to "社交",
                      R.drawable.ic_cyber_game to "电竞", R.drawable.ic_cyber_video to "影音",
                      R.drawable.ic_cyber_github to "极客", R.drawable.icon_back to "暗夜框"
                  ).forEach { (resId, label) ->
                      val cell = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                          background = rBg("#1E2638", dp(10)); setPadding(dp(6), dp(10), dp(6), dp(8))
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0; columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f); setMargins(dp(4), dp(6), dp(4), dp(4))
                          }
                          setOnClickListener {
                              val raw = BitmapFactory.decodeResource(resources, resId)
                              sendIconResult(Bitmap.createScaledBitmap(raw, 240, 240, true), resId)
                          }
                      }
                      cell.addView(ImageView(this).apply { setImageResource(resId); layoutParams = LinearLayout.LayoutParams(dp(48), dp(48)) })
                      cell.addView(TextView(this).apply { text = label; textSize = 11f; setTextColor(Color.WHITE); gravity = Gravity.CENTER })
                      iconGrid.addView(cell)
                  }
                  card2.addView(iconGrid)
                  root.addView(card2)
                  scroll.addView(root); setContentView(scroll)
              }

              private fun refreshStyleUI() {
                  styleBtns.forEachIndexed { i, b ->
                      b.background = rBg(if (i == shapeStyle) "#7B2CBF" else "#222D42", dp(8))
                      b.setTextColor(Color.parseColor(if (i == shapeStyle) "#00F5D4" else "#D9E2EC"))
                  }
              }

              private fun makeIconBitmap(uri: Uri, style: Int): Bitmap? {
                  return try {
                      val src = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) } ?: return null
                      val sz = 240
                      val out = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                      val c = Canvas(out)
                      val sc = maxOf(sz.toFloat() / src.width, sz.toFloat() / src.height)
                      val m = Matrix().apply {
                          setScale(sc, sc)
                          postTranslate((sz - src.width * sc) * 0.5f, (sz - src.height * sc) * 0.5f)
                      }
                      val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                          shader = BitmapShader(src, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP).apply { setLocalMatrix(m) }
                      }
                      val rect = RectF(6f, 6f, sz - 6f, sz - 6f)
                      when (style) {
                          0 -> c.drawRoundRect(rect, 54f, 54f, p)
                          1 -> {
                              c.drawRoundRect(rect, 54f, 54f, p)
                              c.drawRoundRect(rect, 54f, 54f, Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  this.style = Paint.Style.STROKE; strokeWidth = 6f; color = Color.parseColor("#00F5D4")
                              })
                          }
                          2 -> c.drawOval(rect, p)
                          else -> c.drawRect(0f, 0f, sz.toFloat(), sz.toFloat(), p)
                      }
                      src.recycle(); out
                  } catch (_: Exception) { null }
              }

              private fun sendIconResult(bmp: Bitmap, resId: Int) {
                  val res = Intent().apply {
                      putExtra("icon", bmp)
                      putExtra(Intent.EXTRA_SHORTCUT_ICON, bmp)
                      if (resId != 0) putExtra(Intent.EXTRA_SHORTCUT_ICON_RESOURCE, Intent.ShortcutIconResource.fromContext(this@IconPickerActivity, resId))
                  }
                  setResult(Activity.RESULT_OK, res)
                  Toast.makeText(this, "图标已替换！", Toast.LENGTH_SHORT).show()
                  finish()
              }

              private fun rBg(hex: String, r: Int) = GradientDrawable().apply { cornerRadius = r.toFloat(); setColor(Color.parseColor(hex)) }
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/MainActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {

              private val prefs by lazy { getSharedPreferences("nuclear_prefs", Context.MODE_PRIVATE) }
              private lateinit var statusLabel: TextView
              private lateinit var previewCanvas: LiveStylePreviewView
              private lateinit var zoomSeek: SeekBar
              private lateinit var panXSeek: SeekBar
              private lateinit var panYSeek: SeekBar
              private lateinit var zoomText: TextView
              private lateinit var panXText: TextView
              private lateinit var panYText: TextView
              private val modeButtons = mutableListOf<Button>()

              private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null && copyUriToInternalFile(uri, "custom_image.jpg")) {
                      val ver = prefs.getInt("media_version", 0) + 1
                      prefs.edit().putInt("mode", 2).putInt("media_version", ver).apply()
                      updateModeButtonsUI(2)
                      previewCanvas.reloadPreviewBitmap()
                      statusLabel.text = "当前状态：🖼️ 已载入 3D 视差图片（可在下方预览图实时拖拽/缩放）"
                  }
              }

              private val pickVideoLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null && copyUriToInternalFile(uri, "custom_video.mp4")) {
                      val ver = prefs.getInt("media_version", 0) + 1
                      prefs.edit().putInt("mode", 3).putInt("media_version", ver).apply()
                      updateModeButtonsUI(3)
                      previewCanvas.reloadPreviewBitmap()
                      statusLabel.text = "当前状态：🎬 已载入超清视频壁纸（可在下方预览图实时调整大小位置）"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0F19")
                  window.navigationBarColor = Color.parseColor("#0B0F19")

                  val rootScroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0B0F19")); isFillViewport = true }
                  val container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(18), dp(24), dp(18), dp(40)) }

                  container.addView(TextView(this).apply {
                      text = "☢️ 核芯壁纸引擎 4.0 · 一加16专版"
                      textSize = 22f; setTextColor(Color.parseColor("#00F5D4")); typeface = Typeface.DEFAULT_BOLD
                  })
                  container.addView(TextView(this).apply {
                      text = "实时可视化缩放预览窗 | 185Hz 满血高刷 | ColorOS 17 图标包"
                      textSize = 12.5f; setTextColor(Color.parseColor("#8E9AAF")); setPadding(0, dp(4), 0, dp(16))
                  })

                  container.addView(Button(this).apply {
                      text = "🚀 一键激活 / 设为系统桌面壁纸"
                      textSize = 15.5f; setTextColor(Color.parseColor("#0B0F19")); typeface = Typeface.DEFAULT_BOLD
                      background = roundedBg("#00F5D4", dp(14)); setPadding(dp(14), dp(13), dp(14), dp(13))
                      setOnClickListener {
                          try {
                              startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                                  putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(this@MainActivity, NuclearWallpaperService::class.java))
