                  }

                  fun reloadPreviewBitmap() {
                      previewBmp?.recycle()
                      previewBmp = null
                      val mode = prefs.getInt("mode", 0)
                      try {
                          if (mode == 2) {
                              val f = File(filesDir, "custom_image.jpg")
                              if (f.exists()) {
                                  val opts = BitmapFactory.Options().apply { inSampleSize = 2 }
