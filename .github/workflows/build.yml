                      text = "${item.badge} · ${item.title}"
                      textSize = 16f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#00F5D4"))
                  })

                  val subStatus = TextView(this).apply {
                      text = if (item.isVideo) "⏳ 正在缓冲动态视频画面供您试看..." else "⏳ 正在加载高清原图供您试看..."
                      textSize = 12f; setTextColor(Color.parseColor("#FEE440")); setPadding(0, dp(4), 0, dp(10))
                  }
                  root.addView(subStatus)

                  val previewBox = FrameLayout(this).apply {
                      background = roundedBg("#070A12", dp(12))
                      layoutParams = LinearLayout.LayoutParams(dp(240), dp(420)).apply { gravity = Gravity.CENTER_HORIZONTAL }
                  }

                  val thumbImg = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setImageBitmap(createStylizedPlaceholder(item.title, item.accentColor))
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }
                  previewBox.addView(thumbImg)

                  val videoView = VideoView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1, Gravity.CENTER)
                      visibility = View.GONE
                  }
                  previewBox.addView(videoView)

                  val progressBar = ProgressBar(this).apply {
                      layoutParams = FrameLayout.LayoutParams(dp(42), dp(42), Gravity.CENTER)
                  }
                  previewBox.addView(progressBar)
                  root.addView(previewBox)

                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(14), 0, 0)
                  }

                  var cachedPreviewFile: File? = null
                  var dialogClosed = false

                  val cancelBtn = Button(this).apply {
                      text = "❌ 算了，换一张"
                      textSize = 13f; setTextColor(Color.WHITE)
                      background = roundedBg("#252F42", dp(8))
                      layoutParams = LinearLayout.LayoutParams(0, dp(42), 1f).apply { marginEnd = dp(8) }
