          # 2. 独立数据与参数管理单例 WallpaperConfig.kt
          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/WallpaperConfig.kt
          package com.i7ruhua.nuclearwallpaper

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.BitmapFactory
          import android.media.MediaMetadataRetriever
          import java.io.File

          object WallpaperConfig {
              private const val PREF_NAME = "nuclear_prefs"

              fun prefs(ctx: Context): SharedPreferences =
                  ctx.applicationContext.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)

              fun playlistDir(ctx: Context): File =
                  File(ctx.applicationContext.filesDir, "playlist").apply { if (!exists()) mkdirs() }

              fun getPlaylistFiles(ctx: Context): List<File> =
                  playlistDir(ctx).listFiles()
                      ?.filter { it.isFile && (it.name.endsWith(".jpg") || it.name.endsWith(".mp4")) }
                      ?.sortedBy { it.name } ?: emptyList()

              fun getCurrentFile(ctx: Context): File? {
                  val list = getPlaylistFiles(ctx)
                  if (list.isEmpty()) return null
                  val idx = prefs(ctx).getInt("playlist_index", 0).coerceIn(0, list.size - 1)
                  return list[idx]
              }

              fun getParam(ctx: Context, file: File?, attr: String, defVal: Int): Int {
                  val sp = prefs(ctx)
                  if (file == null) return sp.getInt("default_$attr", defVal)
                  val key = "cfg_${file.name}_$attr"
                  return if (sp.contains(key)) sp.getInt(key, defVal) else sp.getInt("default_$attr", defVal)
              }

              fun setParam(ctx: Context, file: File?, attr: String, value: Int) {
                  val ed = prefs(ctx).edit()
                  if (file == null) ed.putInt("default_$attr", value)
                  else ed.putInt("cfg_${file.name}_$attr", value)
                  ed.putInt("transform_tick", prefs(ctx).getInt("transform_tick", 0) + 1)
                  ed.apply()
              }

              fun clearFileConfig(ctx: Context, file: File) {
                  prefs(ctx).edit()
                      .remove("cfg_${file.name}_zoom")
                      .remove("cfg_${file.name}_rotate")
                      .remove("cfg_${file.name}_crop")
                      .remove("cfg_${file.name}_pan_x")
                      .remove("cfg_${file.name}_pan_y")
                      .apply()
              }

              fun isMediaFileValid(file: File, isVideo: Boolean): Boolean {
                  if (!file.exists() || file.length() < 512L) return false
                  return try {
                      if (isVideo) {
                          val mmr = MediaMetadataRetriever()
                          mmr.setDataSource(file.absolutePath)
                          val hasVideo = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_HAS_VIDEO)
                          val frame = mmr.getFrameAtTime(0)
                          mmr.release()
                          val ok = (hasVideo != null || frame != null)
                          frame?.recycle()
                          ok
                      } else {
                          val opts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeFile(file.absolutePath, opts)
                          opts.outWidth > 0 && opts.outHeight > 0
                      }
                  } catch (_: Exception) {
                      false
                  }
              }
          }
          EOF

          # 3. 独立预览组件 LiveStylePreviewView.kt
          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/LiveStylePreviewView.kt
          package com.i7ruhua.nuclearwallpaper

          import android.content.Context
          import android.graphics.*
          import android.media.MediaMetadataRetriever
          import android.view.MotionEvent
          import android.view.View
          import kotlin.concurrent.thread

          class LiveStylePreviewView(
              ctx: Context,
              private val onPanChanged: (Int, Int) -> Unit
          ) : View(ctx) {

              private var previewBmp: Bitmap? = null
              @Volatile private var isLoadingBmp = false
              private var loadToken = 0

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val framePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = dp(2f); color = Color.parseColor("#00F5D4")
              }
              private val dashPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = dp(1f); color = Color.parseColor("#77FFFFFF")
                  pathEffect = DashPathEffect(floatArrayOf(10f, 8f), 0f)
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CCFFFFFF"); textSize = dp(10.5f); textAlign = Paint.Align.CENTER
              }
              private val outerClip = Path()
              private var lastX = 0f
              private var lastY = 0f

              init { reloadPreviewBitmap() }

              fun reloadPreviewBitmap() {
                  val f = WallpaperConfig.getCurrentFile(context)
                  val currentToken = ++loadToken
                  if (f == null) {
                      previewBmp?.recycle()
                      previewBmp = null
                      isLoadingBmp = false
                      invalidate()
                      return
                  }
                  isLoadingBmp = true
                  invalidate()
                  thread {
                      val decoded: Bitmap? = try {
                          if (f.name.endsWith(".mp4")) {
                              val mmr = MediaMetadataRetriever()
                              mmr.setDataSource(f.absolutePath)
                              val frame = mmr.getFrameAtTime(0)
                              mmr.release()
                              frame
                          } else {
                              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              BitmapFactory.decodeFile(f.absolutePath, bounds)
                              var sample = 1
                              while (bounds.outWidth / sample > 1080 || bounds.outHeight / sample > 1920) {
                                  sample *= 2
                              }
                              BitmapFactory.decodeFile(f.absolutePath, BitmapFactory.Options().apply { inSampleSize = sample })
                          }
                      } catch (_: Exception) { null }

                      post {
                          if (currentToken == loadToken) {
                              previewBmp?.recycle()
                              previewBmp = decoded
                              isLoadingBmp = false
                              invalidate()
                          } else {
                              decoded?.recycle()
                          }
                      }
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val f = WallpaperConfig.getCurrentFile(context)
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          lastX = event.x; lastY = event.y
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = (event.x - lastX) / width.coerceAtLeast(1)
                          val dy = (event.y - lastY) / height.coerceAtLeast(1)
                          lastX = event.x; lastY = event.y
                          val nx = (WallpaperConfig.getParam(context, f, "pan_x", 50) + (dx * 100).toInt()).coerceIn(0, 100)
                          val ny = (WallpaperConfig.getParam(context, f, "pan_y", 50) + (dy * 100).toInt()).coerceIn(0, 100)
                          onPanChanged(nx, ny)
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> parent?.requestDisallowInterceptTouchEvent(false)
                  }
                  return super.onTouchEvent(event)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat(); val h = height.toFloat()
                  val rect = RectF(4f, 4f, w - 4f, h - 4f)
                  outerClip.reset()
                  outerClip.addRoundRect(rect, dp(16f), dp(16f), Path.Direction.CW)

                  canvas.save()
                  canvas.clipPath(outerClip)
                  canvas.drawColor(Color.parseColor("#070A12"))

                  val f = WallpaperConfig.getCurrentFile(context)
                  val zoom = (WallpaperConfig.getParam(context, f, "zoom", 100) / 100f).coerceIn(0.3f, 3.0f)
                  val rot = WallpaperConfig.getParam(context, f, "rotate", 0).toFloat()
                  val crop = (WallpaperConfig.getParam(context, f, "crop", 0) / 100f).coerceIn(0f, 0.42f)
                  val panX = (WallpaperConfig.getParam(context, f, "pan_x", 50) - 50) / 100f
                  val panY = (WallpaperConfig.getParam(context, f, "pan_y", 50) - 50) / 100f
                  val cx = (0.5f + panX) * w
                  val cy = (0.5f + panY) * h

                  val bmp = previewBmp
                  if (isLoadingBmp) {
                      canvas.drawText("⏳ 正在异步解码高清预览帧...", w * 0.5f, h * 0.5f, textPaint)
                  } else if (bmp != null && bmp.width > 0 && bmp.height > 0) {
                      val mAspect = bmp.width.toFloat() / bmp.height.toFloat()
                      val bw = w * zoom
                      val bh = (w / mAspect) * zoom
                      val srcLeft = (bmp.width * crop).toInt()
                      val srcTop = (bmp.height * crop).toInt()
                      val srcRight = (bmp.width * (1f - crop)).toInt().coerceAtLeast(srcLeft + 1)
                      val srcBottom = (bmp.height * (1f - crop)).toInt().coerceAtLeast(srcTop + 1)

                      canvas.save()
                      canvas.translate(cx, cy)
                      canvas.rotate(rot)
                      canvas.drawBitmap(
                          bmp,
                          Rect(srcLeft, srcTop, srcRight, srcBottom),
                          RectF(-bw * 0.5f, -bh * 0.5f, bw * 0.5f, bh * 0.5f),
                          paint
                      )
                      canvas.restore()
                  } else {
                      canvas.drawText("请先添加本地壁纸或点击下方卡片试看下载", w * 0.5f, h * 0.5f, textPaint)
                  }

                  canvas.drawRoundRect(RectF(w * 0.08f, h * 0.08f, w * 0.92f, h * 0.24f), dp(8f), dp(8f), dashPaint)
                  for (r in 0..2) for (c in 0..3) {
                      val ix = w * (0.14f + c * 0.22f); val iy = h * (0.33f + r * 0.13f)
                      canvas.drawRoundRect(RectF(ix, iy, ix + w * 0.12f, iy + w * 0.12f), dp(4f), dp(4f), dashPaint)
                  }
                  canvas.drawText("专属参数 · 缩放:${(zoom*100).toInt()}% | 旋转:${rot.toInt()}° | 裁边:${(crop*100).toInt()}%", w * 0.5f, h * 0.93f, textPaint)
                  canvas.restore()
                  canvas.drawRoundRect(rect, dp(16f), dp(16f), framePaint)
              }

              private fun dp(v: Float) = v * resources.displayMetrics.density
          }
          EOF

          # 4. 图标裁切小工具 IconPickerActivity.kt
          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/IconPickerActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.io.File
          import java.io.FileOutputStream

          class IconPickerActivity : AppCompatActivity() {
              private lateinit var previewIv: ImageView
              private val pickPhoto = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) }?.let { src ->
                          val sz = 256
                          val out = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                          val c = Canvas(out)
                          val sc = maxOf(sz.toFloat() / src.width, sz.toFloat() / src.height)
                          val m = Matrix().apply { setScale(sc, sc); postTranslate((sz - src.width * sc) * 0.5f, (sz - src.height * sc) * 0.5f) }
                          val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                              shader = BitmapShader(src, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP).apply { setLocalMatrix(m) }
                          }
                          c.drawRoundRect(RectF(8f, 8f, sz - 8f, sz - 8f), 58f, 58f, p)
                          src.recycle()
                          previewIv.setImageBitmap(out)
                          val saved = File(filesDir, "custom_icon_${System.currentTimeMillis()}.png")
                          FileOutputStream(saved).use { out.compress(Bitmap.CompressFormat.PNG, 100, it) }
                          Toast.makeText(this, "✅ 圆角图标已生成！", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0F19")
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#0B0F19"))
                      setPadding(dp(20), dp(32), dp(20), dp(32))
                  }
                  root.addView(TextView(this).apply {
                      text = "🎨 核芯圆角图标裁切工坊"; textSize = 20f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#00F5D4"))
                  })
                  previewIv = ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(120), dp(120)).apply { topMargin = dp(24) }
                  }
                  root.addView(previewIv)
                  root.addView(Button(this).apply {
                      text = "🖼️ 从相册选图裁切为一加圆角图标"
                      textSize = 15f; setTextColor(Color.parseColor("#0B0F19")); typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply { cornerRadius = dp(12).toFloat(); setColor(Color.parseColor("#00F5D4")) }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(18) }
                      setOnClickListener { pickPhoto.launch("image/*") }
                  })
                  setContentView(root)
              }
              private fun dp(v: Number) = (v.toFloat() * resources.displayMetrics.density).toInt()
          }
          EOF

          # 5. 主界面 MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/MainActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.Dialog
