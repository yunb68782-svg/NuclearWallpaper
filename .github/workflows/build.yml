          class MainActivity : AppCompatActivity() {

              data class OnlineWallpaperItem(
                  val title: String,
                  val thumbAssetOrUrl: String,
                  val mediaAssetOrUrl: String,
                  val isVideo: Boolean,
                  val isBuiltinAsset: Boolean,
                  val badge: String
