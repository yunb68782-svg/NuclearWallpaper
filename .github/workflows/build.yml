                          renderThread?.onDesktopBecameVisible()
                          renderThread?.setPaused(false)
                      } else {
                          // 离开桌面或锁屏时彻底解绑传感器并挂起渲染线程，后台 0 运行
                          sensorManager.unregisterListener(this)
                          renderThread?.setPaused(true)
                      }
                  }

                  override fun onSurfaceCreated(holder: SurfaceHolder) {
                      super.onSurfaceCreated(holder)
                      stopRenderThread()
                      renderThread = GLRenderThread(holder).apply { start(); setPaused(!isEngineVisible) }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      super.onSurfaceChanged(holder, format, width, height)
                      renderThread?.updateSurfaceSize(width, height)
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      stopRenderThread()
                      super.onSurfaceDestroyed(holder)
                  }

                  override fun onTouchEvent(event: MotionEvent) {
                      if (event.action == MotionEvent.ACTION_DOWN || event.action == MotionEvent.ACTION_MOVE) {
                          val w = renderThread?.screenWidth ?: 1080
                          val h = renderThread?.screenHeight ?: 2400
                          if (w > 0 && h > 0) {
                              touchX = (event.x / w.toFloat()).coerceIn(0f, 1f)
                              touchY = (event.y / h.toFloat()).coerceIn(0f, 1f)
                              lastTouchTimestamp = renderThread?.currentElapsedSec ?: 0f
                          }
                      }
                      super.onTouchEvent(event)
                  }

                  override fun onSharedPreferenceChanged(sp: SharedPreferences?, key: String?) {
                      renderThread?.notifyPrefsChanged()
                  }

                  override fun onSensorChanged(event: SensorEvent) {
                      if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                          targetTiltX = (-event.values[0] / 9.81f).coerceIn(-1.2f, 1.2f)
                          targetTiltY = (event.values[1] / 9.81f).coerceIn(-1.2f, 1.2f)
                      }
                  }

                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

                  private fun stopRenderThread() {
                      renderThread?.let { it.requestStop(); try { it.join(1000) } catch (_: Exception) {} }
                      renderThread = null
                  }

                  private inner class GLRenderThread(private val holder: SurfaceHolder) : Thread("NuclearGL5") {
                      @Volatile var screenWidth = 1080
                      @Volatile var screenHeight = 2400
                      @Volatile var currentElapsedSec = 0f

                      private val running = AtomicBoolean(true)
                      private val paused = AtomicBoolean(false)
                      private val prefsDirty = AtomicBoolean(true)
                      private val videoFrameAvailable = AtomicBoolean(false)

                      private var eglDisplay = EGL14.EGL_NO_DISPLAY
                      private var eglContext = EGL14.EGL_NO_CONTEXT
                      private var eglSurface = EGL14.EGL_NO_SURFACE

                      private var progImage = 0
                      private var progVideo = 0
                      private var imageTexId = 0
                      private var videoOesTexId = 0

                      private var surfaceTexture: SurfaceTexture? = null
                      private var videoSurface: Surface? = null
                      private var mediaPlayer: MediaPlayer? = null

                      private var targetFps = 120
                      private var parallaxOn = true
                      private var zoomFactor = 1.0f
                      private var rotateRad = 0f
                      private var cropMargin = 0f
                      private var panX = 0f
                      private var panY = 0f
                      private var rippleEnabled = true
                      private var videoAudioEnabled = false
                      private var carouselMode = 1
                      private var lastSwitchMs = System.currentTimeMillis()

                      private var currentFilePath = ""
                      private var isCurrentVideo = false
                      private var hasValidMedia = false
                      private var mediaAspect = 0.5625f
                      private var smoothTiltX = 0f
                      private var smoothTiltY = 0f

                      private val vertexBuffer: FloatBuffer = ByteBuffer.allocateDirect(32).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                          put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f)); position(0)
                      }

                      fun updateSurfaceSize(w: Int, h: Int) { if (w > 0 && h > 0) { screenWidth = w; screenHeight = h } }
                      fun setPaused(p: Boolean) { paused.set(p); synchronized(this) { (this as Object).notifyAll() } }
                      fun notifyPrefsChanged() { prefsDirty.set(true); synchronized(this) { (this as Object).notifyAll() } }
                      fun requestStop() { running.set(false); synchronized(this) { (this as Object).notifyAll() } }

                      // 每次从其他软件退回桌面或解锁亮屏时触发
                      fun onDesktopBecameVisible() {
                          if (prefs.getInt("carousel_mode", 1) == 1) {
                              advancePlaylistByOne()
                          }
                      }

                      private fun advancePlaylistByOne() {
                          val dir = File(applicationContext.filesDir, "playlist")
                          val files = dir.listFiles()?.filter { it.isFile && (it.name.endsWith(".jpg") || it.name.endsWith(".mp4")) }?.sortedBy { it.name } ?: emptyList()
                          if (files.size > 1) {
                              val next = (prefs.getInt("playlist_index", 0) + 1) % files.size
                              prefs.edit().putInt("playlist_index", next).apply()
                              prefsDirty.set(true)
                          }
                          lastSwitchMs = System.currentTimeMillis()
                      }

                      override fun run() {
                          if (!initEGL()) return
                          initGL()
                          val startNs = System.nanoTime()
                          while (running.get()) {
                              synchronized(this) {
                                  while (paused.get() && running.get()) {
                                      try { mediaPlayer?.let { if (it.isPlaying) it.pause() } } catch (_: Exception) {}
                                      try { (this as Object).wait() } catch (_: Exception) {}
                                  }
                              }
                              if (!running.get()) break
                              if (prefsDirty.compareAndSet(true, false)) syncPrefsAndPlaylist()

                              // 仅在桌面可见时检查定时轮播（后台完全休眠不耗电）
                              val now = System.currentTimeMillis()
                              if (carouselMode == 2 && now - lastSwitchMs > 60_000L) advancePlaylistByOne()
                              else if (carouselMode == 3 && now - lastSwitchMs > 300_000L) advancePlaylistByOne()

                              if (isCurrentVideo && hasValidMedia) {
                                  try { mediaPlayer?.let { if (!it.isPlaying) it.start() } } catch (_: Exception) {}
                              } else {
                                  try { mediaPlayer?.let { if (it.isPlaying) it.pause() } } catch (_: Exception) {}
                              }

                              val t0 = System.currentTimeMillis()
                              currentElapsedSec = (System.nanoTime() - startNs) / 1_000_000_000f
                              smoothTiltX += ((if (parallaxOn) targetTiltX else 0f) - smoothTiltX) * 0.08f
                              smoothTiltY += ((if (parallaxOn) targetTiltY else 0f) - smoothTiltY) * 0.08f

                              drawFrame()
                              EGL14.eglSwapBuffers(eglDisplay, eglSurface)

                              if (targetFps < 144) {
                                  val sleepMs = (1000L / targetFps.coerceIn(30, 120)) - (System.currentTimeMillis() - t0)
                                  if (sleepMs > 1L) try { sleep(sleepMs) } catch (_: Exception) {}
                              }
                          }
                          releaseAll()
                      }

                      private fun syncPrefsAndPlaylist() {
                          targetFps = prefs.getInt("fps", 120)
                          parallaxOn = prefs.getBoolean("parallax_on", true)
                          zoomFactor = (prefs.getInt("zoom", 100) / 100f).coerceIn(0.3f, 3.0f)
                          rotateRad = Math.toRadians(prefs.getInt("rotate", 0).toDouble()).toFloat()
                          cropMargin = (prefs.getInt("crop", 0) / 100f).coerceIn(0f, 0.42f)
                          panX = (prefs.getInt("pan_x", 50) - 50) / 100f
                          panY = (prefs.getInt("pan_y", 50) - 50) / 100f
                          rippleEnabled = prefs.getBoolean("ripple", true)
                          videoAudioEnabled = prefs.getBoolean("video_audio", false)
                          carouselMode = prefs.getInt("carousel_mode", 1)

                          val dir = File(applicationContext.filesDir, "playlist")
                          val files = dir.listFiles()?.filter { it.isFile && (it.name.endsWith(".jpg") || it.name.endsWith(".mp4")) }?.sortedBy { it.name } ?: emptyList()
                          if (files.isEmpty()) {
                              hasValidMedia = false; currentFilePath = ""; return
                          }
                          val idx = prefs.getInt("playlist_index", 0).coerceIn(0, files.size - 1)
                          val targetFile = files[idx]

                          if (targetFile.absolutePath != currentFilePath || !hasValidMedia) {
                              currentFilePath = targetFile.absolutePath
                              if (targetFile.name.endsWith(".mp4")) {
                                  isCurrentVideo = true
                                  try {
                                      mediaPlayer?.release()
                                      if (surfaceTexture == null) {
                                          surfaceTexture = SurfaceTexture(videoOesTexId).apply { setOnFrameAvailableListener { videoFrameAvailable.set(true) } }
                                          videoSurface = Surface(surfaceTexture)
                                      }
                                      mediaPlayer = MediaPlayer().apply {
                                          setDataSource(targetFile.absolutePath); setSurface(videoSurface); isLooping = true
                                          val v = if (videoAudioEnabled) 1f else 0f; setVolume(v, v)
                                          setOnVideoSizeChangedListener { _, w, h -> if (w > 0 && h > 0) mediaAspect = w.toFloat() / h }
                                          prepare(); start()
                                      }
                                      hasValidMedia = true
                                  } catch (_: Exception) { hasValidMedia = false }
                              } else {
                                  isCurrentVideo = false
                                  try { mediaPlayer?.let { if (it.isPlaying) it.pause() } } catch (_: Exception) {}
                                  val bmp = BitmapFactory.decodeFile(targetFile.absolutePath)
                                  if (bmp != null) {
                                      mediaAspect = bmp.width.toFloat() / bmp.height.coerceAtLeast(1)
                                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, imageTexId)
                                      GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, bmp, 0)
                                      bmp.recycle(); hasValidMedia = true
                                  } else hasValidMedia = false
                              }
                          }
                          try { mediaPlayer?.let { val v = if (videoAudioEnabled) 1f else 0f; it.setVolume(v, v) } } catch (_: Exception) {}
                      }

                      private fun drawFrame() {
                          GLES20.glViewport(0, 0, screenWidth, screenHeight)
                          GLES20.glClearColor(0.027f, 0.039f, 0.07f, 1f)
                          GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)
                          if (!hasValidMedia) return

                          if (isCurrentVideo && videoFrameAvailable.compareAndSet(true, false)) {
                              try { surfaceTexture?.updateTexImage() } catch (_: Exception) {}
                          }
                          val prog = if (isCurrentVideo) progVideo else progImage
                          GLES20.glUseProgram(prog)
                          val pos = GLES20.glGetAttribLocation(prog, "aPosition")
                          GLES20.glEnableVertexAttribArray(pos)
                          GLES20.glVertexAttribPointer(pos, 2, GLES20.GL_FLOAT, false, 0, vertexBuffer)

                          val sAspect = screenWidth.toFloat() / screenHeight.coerceAtLeast(1)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uScreenAspect"), sAspect)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uMediaAspect"), mediaAspect)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uZoom"), zoomFactor)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uAngle"), rotateRad)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uCrop"), cropMargin)
                          GLES20.glUniform2f(GLES20.glGetUniformLocation(prog, "uPan"), panX, panY)
                          GLES20.glUniform2f(GLES20.glGetUniformLocation(prog, "uTilt"), smoothTiltX * 0.035f, smoothTiltY * 0.035f)
                          GLES20.glUniform2f(GLES20.glGetUniformLocation(prog, "uTouch"), touchX, touchY)
                          GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uTouchAge"), if (rippleEnabled) (currentElapsedSec - lastTouchTimestamp) else 999f)

                          GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
                          if (isCurrentVideo) {
                              GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, videoOesTexId)
                              GLES20.glUniform1i(GLES20.glGetUniformLocation(prog, "uTex"), 0)
                          } else {
                              GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, imageTexId)
                              GLES20.glUniform1i(GLES20.glGetUniformLocation(prog, "uTex"), 0)
                          }
                          GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
                      }

                      private fun initEGL(): Boolean {
                          eglDisplay = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY)
                          val ver = IntArray(2)
                          if (!EGL14.eglInitialize(eglDisplay, ver, 0, ver, 1)) return false
                          val cfg = arrayOfNulls<EGLConfig>(1)
                          val num = IntArray(1)
                          val att = intArrayOf(EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT, EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8, EGL14.EGL_NONE)
                          EGL14.eglChooseConfig(eglDisplay, att, 0, cfg, 0, 1, num, 0)
                          eglContext = EGL14.eglCreateContext(eglDisplay, cfg[0], EGL14.EGL_NO_CONTEXT, intArrayOf(EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE), 0)
                          eglSurface = EGL14.eglCreateWindowSurface(eglDisplay, cfg[0], holder, intArrayOf(EGL14.EGL_NONE), 0)
                          return EGL14.eglMakeCurrent(eglDisplay, eglSurface, eglSurface, eglContext)
                      }

                      private fun initGL() {
                          progImage = linkProg(VS, FS_IMG)
                          progVideo = linkProg(VS, FS_VID)
                          val ids = IntArray(2); GLES20.glGenTextures(2, ids, 0)
                          imageTexId = ids[0]; videoOesTexId = ids[1]
                          for (t in listOf(GLES20.GL_TEXTURE_2D to imageTexId, GLES11Ext.GL_TEXTURE_EXTERNAL_OES to videoOesTexId)) {
                              GLES20.glBindTexture(t.first, t.second)
                              GLES20.glTexParameteri(t.first, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                              GLES20.glTexParameteri(t.first, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
                              GLES20.glTexParameteri(t.first, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
                              GLES20.glTexParameteri(t.first, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
                          }
                      }

                      private fun linkProg(vs: String, fs: String): Int {
                          val p = GLES20.glCreateProgram()
                          val v = GLES20.glCreateShader(GLES20.GL_VERTEX_SHADER).also { GLES20.glShaderSource(it, vs); GLES20.glCompileShader(it) }
                          val f = GLES20.glCreateShader(GLES20.GL_FRAGMENT_SHADER).also { GLES20.glShaderSource(it, fs); GLES20.glCompileShader(it) }
                          GLES20.glAttachShader(p, v); GLES20.glAttachShader(p, f); GLES20.glLinkProgram(p)
                          return p
                      }

                      private fun releaseAll() {
                          try { mediaPlayer?.release(); videoSurface?.release(); surfaceTexture?.release() } catch (_: Exception) {}
                          if (eglDisplay != EGL14.EGL_NO_DISPLAY) {
                              EGL14.eglMakeCurrent(eglDisplay, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT)
                              EGL14.eglDestroySurface(eglDisplay, eglSurface)
                              EGL14.eglDestroyContext(eglDisplay, eglContext)
                              EGL14.eglTerminate(eglDisplay)
                          }
                      }
                  }
              }

              companion object {
                  private const val VS = """
                      attribute vec2 aPosition;
                      varying vec2 vUv;
                      void main() { vUv = aPosition * 0.5 + 0.5; gl_Position = vec4(aPosition, 0.0, 1.0); }
                  """
                  // 1:1 匹配预览框的 360° 旋转矩阵 + 自由裁切 + 纯净黑底无残影
                  private const val COMMON_BODY = """
                      vec2 scrUv = vec2(vUv.x, 1.0 - vUv.y);
                      vec2 asp = vec2(uScreenAspect, 1.0);
                      vec2 rip = vec2(0.0); float glow = 0.0;
                      if (uTouchAge >= 0.0 && uTouchAge < 2.8) {
                          float d = length((scrUv - uTouch) * asp);
                          rip = normalize(scrUv - uTouch + 0.0001) * sin(d*45.0 - uTouchAge*14.0) * exp(-d*5.5 - uTouchAge*1.8) * 0.02;
                          glow = smoothstep(0.035, 0.0, abs(d - uTouchAge*0.32)) * exp(-uTouchAge*1.6);
                      }
                      float dx = (scrUv.x - 0.5 - uPan.x) * uScreenAspect + uTilt.x;
                      float dy = (scrUv.y - 0.5 - uPan.y) + uTilt.y;
                      float c = cos(uAngle), s = sin(uAngle);
                      float rx = dx * c + dy * s;
                      float ry = -dx * s + dy * c;
                      float wPhys = uScreenAspect * uZoom;
                      float hPhys = (uScreenAspect / uMediaAspect) * uZoom;
                      vec2 raw = vec2(rx / wPhys + 0.5, ry / hPhys + 0.5) + rip;
                      float inBox = step(uCrop, raw.x) * step(raw.x, 1.0 - uCrop) * step(uCrop, raw.y) * step(raw.y, 1.0 - uCrop);
                      vec2 uv = clamp(raw, 0.001, 0.999);
                      vec3 texCol = texture2D(uTex, uv).rgb;
                      vec3 bgCol = vec3(0.027, 0.039, 0.07);
                      gl_FragColor = vec4(mix(bgCol, texCol, inBox) + vec3(0.0, 0.96, 0.83) * glow, 1.0);
                  """
                  private const val FS_IMG = """
                      precision highp float;
                      varying vec2 vUv;
                      uniform float uScreenAspect, uMediaAspect, uZoom, uAngle, uCrop, uTouchAge;
                      uniform vec2 uPan, uTilt, uTouch;
                      uniform sampler2D uTex;
                      void main() { $COMMON_BODY }
                  """
                  private const val FS_VID = """
                      #extension GL_OES_EGL_image_external : require
                      precision highp float;
                      varying vec2 vUv;
                      uniform float uScreenAspect, uMediaAspect, uZoom, uAngle, uCrop, uTouchAge;
                      uniform vec2 uPan, uTilt, uTouch;
                      uniform samplerExternalOES uTex;
                      void main() { $COMMON_BODY }
                  """
              }
          }
          EOF

      - name: Compile 5.0 APK
        run: gradle assembleDebug --no-daemon

      - name: Upload 5.0 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuclearWallpaper-5.0-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
