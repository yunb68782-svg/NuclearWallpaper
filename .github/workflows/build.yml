                          btn.setTextColor(Color.parseColor("#00F5D4"))
                      } else {
                          btn.background = roundedBg("#222D42", dp(10))
                          btn.setTextColor(Color.parseColor("#D9E2EC"))
                      }
                  }
              }

              private fun createStyledIconFromUri(uri: Uri, style: Int): Bitmap? {
                  return try {
                      val src = contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it)
                      } ?: return null

                      val size = 240
                      val out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(out)

                      // Center-crop 矩阵计算
                      val scale: Float
                      var dx = 0f
                      var dy = 0f
                      if (src.width * size > size * src.height) {
                          scale = size.toFloat() / src.height.toFloat()
                          dx = (size - src.width * scale) * 0.5f
                      } else {
                          scale = size.toFloat() / src.width.toFloat()
                          dy = (size - src.height * scale) * 0.5f
                      }
                      val shaderMatrix = Matrix().apply {
                          setScale(scale, scale)
                          postTranslate(dx, dy)
                      }
                      val imgPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                          shader = BitmapShader(src, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP).apply {
                              setLocalMatrix(shaderMatrix)
                          }
                      }

                      val pad = 6f
                      val rect = RectF(pad, pad, size - pad, size - pad)

                      when (style) {
                          0 -> {
                              // 一加原生圆角
                              canvas.drawRoundRect(rect, 54f, 54f, imgPaint)
                          }
                          1 -> {
                              // 赛博霓虹发光外框 + 一加圆角
                              canvas.drawRoundRect(rect, 54f, 54f, imgPaint)
                              val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  this.style = Paint.Style.STROKE
                                  strokeWidth = 6f
                                  color = Color.parseColor("#00F5D4")
                              }
                              canvas.drawRoundRect(rect, 54f, 54f, borderPaint)
                          }
                          2 -> {
                              // 纯圆头像图标
                              canvas.drawOval(rect, imgPaint)
                              val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  this.style = Paint.Style.STROKE
                                  strokeWidth = 4f
                                  color = Color.parseColor("#9B5DE5")
                              }
                              canvas.drawOval(rect, borderPaint)
                          }
                          else -> {
                              // 无裁切铺满
                              canvas.drawRect(0f, 0f, size.toFloat(), size.toFloat(), imgPaint)
                          }
                      }
                      src.recycle()
                      out
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun returnIconToLauncher(bitmap: Bitmap, resId: Int) {
                  val result = Intent()
                  result.putExtra("icon", bitmap)
                  result.putExtra(Intent.EXTRA_SHORTCUT_ICON, bitmap)
                  if (resId != 0) {
                      val iconRes = Intent.ShortcutIconResource.fromContext(this, resId)
                      result.putExtra(Intent.EXTRA_SHORTCUT_ICON_RESOURCE, iconRes)
                  }
                  setResult(Activity.RESULT_OK, result)
                  Toast.makeText(this, "图标已生成并注入桌面！", Toast.LENGTH_SHORT).show()
                  finish()
              }

              private fun roundedBg(hexColor: String, radiusPx: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = radiusPx.toFloat()
                      setColor(Color.parseColor(hexColor))
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }
          }
