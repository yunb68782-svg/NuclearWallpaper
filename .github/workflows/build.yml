name: Build Nuclear Wallpaper 6.0 Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate 6.0 Clean Architecture & Built-in Dynamic Videos
        run: |
          pip install pillow imageio-ffmpeg
          mkdir -p app/src/main/java/com/i7ruhua/nuclearwallpaper
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/assets/builtin_videos

          # 1. 生成应用图标与 6 套真·60fps 动态视频壁纸及 1:1 同源首帧封面
          python3 - << 'PYEOF'
          import math, subprocess, os
          import imageio_ffmpeg
          from PIL import Image, ImageDraw, ImageFilter

          FFMPEG_BIN = imageio_ffmpeg.get_ffmpeg_exe()
          OUT = "app/src/main/res/drawable-nodpi"
          VID_DIR = "app/src/main/assets/builtin_videos"
          S = 512

          def base_box(c1, c2, border, glow):
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              grad = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              gd = ImageDraw.Draw(grad)
              for y in range(S):
                  t = y / float(S)
                  col = tuple(int(c1[i] * (1 - t) + c2[i] * t) for i in range(3)) + (248,)
                  gd.line([(0, y), (S, y)], fill=col)
              mask = Image.new("L", (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=255)
              img.paste(grad, (0, 0), mask)
              g = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              ImageDraw.Draw(g).ellipse([96, 96, S - 96, S - 96], fill=glow + (80,))
              img = Image.alpha_composite(img, g.filter(ImageFilter.GaussianBlur(40)))
              ImageDraw.Draw(img).rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=border, width=8)
              return img

          def make_icon(name, a1, a2):
              b = base_box((18, 25, 46), (7, 10, 20), a1 + (235,), a2)
              ly = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(ly)
              cx = cy = S // 2
              for ang in [0, 60, 120]:
                  r = math.radians(ang)
                  pts = [(cx + 150*math.cos(math.radians(t))*math.cos(r) - 55*math.sin(math.radians(t))*math.sin(r),
                          cy + 150*math.cos(math.radians(t))*math.sin(r) + 55*math.sin(math.radians(t))*math.cos(r)) for t in range(0, 360, 8)]
                  d.polygon(pts, outline=a1 + (240,), width=10)
              d.ellipse([cx-36, cy-36, cx+36, cy+36], fill=a2+(255,), outline=(255,255,255,245), width=5)
              Image.alpha_composite(b, ly).save(f"{OUT}/{name}.png")

          make_icon("ic_launcher", (0,245,212), (247,37,133))

          presets = [
              ("dyn_1", "geq=r='12+110*sin(X/38+T*3.5)*cos(Y/45-T*2)':g='200*pow(0.5+0.5*sin(X/30+Y/40-T*4),2)':b='235*pow(0.5+0.5*cos(X/25-T*3),2)'"),
              ("dyn_2", "geq=r='240*pow(0.5+0.5*sin((X+Y)/32-T*5),3)':g='15+40*sin(Y/20+T*2)':b='90*pow(0.5+0.5*cos((X-Y)/28+T*4),2)'"),
              ("dyn_3", "geq=r='10+30*sin(T*2)':g='230*pow(0.5+0.5*sin(Y/18-T*6+3*sin(X/12)),3)':b='140*pow(0.5+0.5*cos(X/22+T*3),2)'"),
              ("dyn_4", "geq=r='130*pow(0.5+0.5*sin(hypot(X-180,Y-320)/22-T*4),2)':g='40+150*pow(0.5+0.5*cos(hypot(X-180,Y-320)/28-T*3),2)':b='245'"),
              ("dyn_5", "geq=r='20+160*pow(0.5+0.5*sin(X/45+sin(Y/35+T*2.5)*2),2)':g='220*pow(0.5+0.5*cos(Y/50+T*3),2)':b='180'"),
              ("dyn_6", "geq=r='250*pow(0.5+0.5*sin(X/24+T*4)*sin(Y/24-T*4),2)':g='175*pow(0.5+0.5*cos(X/24-T*3),2)':b='25'")
          ]
          for name, expr in presets:
              mp4_path = f"{VID_DIR}/{name}.mp4"
              jpg_path = f"{VID_DIR}/{name}.jpg"
              subprocess.run([
                  FFMPEG_BIN, "-y", "-f", "lavfi",
                  "-i", f"nullsrc=s=360x640:d=3:r=30,{expr},format=yuv420p",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "23", mp4_path
              ], check=True)
              subprocess.run([
                  FFMPEG_BIN, "-y", "-i", mp4_path, "-frames:v", "1", "-q:v", "3", jpg_path
              ], check=True)
          PYEOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NuclearWallpaper"
          include(":app")
          EOF

