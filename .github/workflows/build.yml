                      super.onDraw(canvas)
                      val w = width.toFloat(); val h = height.toFloat()
                      val rect = RectF(4f, 4f, w - 4f, h - 4f)
                      clipPath.reset()
                      clipPath.addRoundRect(rect, dp(18).toFloat(), dp(18).toFloat(), Path.Direction.CW)

                      canvas.save()
                      canvas.clipPath(clipPath)
                      canvas.drawColor(Color.parseColor("#080B14"))

                      val zoom = (prefs.getInt("zoom", 100) / 100f).coerceIn(0.3f, 2.5f)
                      val panX = (prefs.getInt("pan_x", 50) - 50) / 100f
                      val panY = (prefs.getInt("pan_y", 50) - 50) / 100f
                      val cx = w * 0.5f + panX * w
                      val cy = h * 0.5f + panY * h

                      val bmp = previewBmp
                      if (bmp != null && bmp.width > 0 && bmp.height > 0) {
                          val baseScale = maxOf(w / bmp.width, h / bmp.height)
                          val finalScale = baseScale * (zoom / 0.90f)
                          val bw = bmp.width * finalScale
                          val bh = bmp.height * finalScale
                          val dst = RectF(cx - bw * 0.5f, cy - bh * 0.5f, cx + bw * 0.5f, cy + bh * 0.5f)
                          // 绘制暗化背景与主图区域
                          paint.alpha = 55
                          canvas.drawBitmap(bmp, null, rect, paint)
                          paint.alpha = 255
                          canvas.drawBitmap(bmp, null, dst, paint)
                          canvas.drawRect(dst, Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              style = Paint.Style.STROKE; strokeWidth = 3f; color = Color.parseColor("#FEE440")
                          })
                      } else {
                          // 内置核聚变/黑洞实时缩放示意环
                          for (i in 1..4) {
                              val r = (w * 0.12f * i) * zoom
                              canvas.drawCircle(cx, cy, r, Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  style = Paint.Style.STROKE; strokeWidth = 4f
                                  color = if (i % 2 == 0) Color.parseColor("#00F5D4") else Color.parseColor("#9B5DE5")
                              })
                          }
                      }

                      // 叠加一加 16 桌面布局参考虚线（顶部自选照片小组件 + 图标网格 + 底部 Dock 栏）
                      val widgetRect = RectF(w * 0.08f, h * 0.08f, w * 0.92f, h * 0.25f)
                      canvas.drawRoundRect(widgetRect, dp(10).toFloat(), dp(10).toFloat(), dashPaint)
                      canvas.drawText("桌面顶部小组件区", w * 0.5f, h * 0.17f, textPaint)

                      for (row in 0..2) {
                          for (col in 0..3) {
                              val ix = w * (0.14f + col * 0.22f)
                              val iy = h * (0.34f + row * 0.13f)
                              canvas.drawRoundRect(RectF(ix, iy, ix + w * 0.12f, iy + w * 0.12f), dp(4).toFloat(), dp(4).toFloat(), dashPaint)
                          }
                      }
                      val dockRect = RectF(w * 0.08f, h * 0.86f, w * 0.92f, h * 0.95f)
                      canvas.drawRoundRect(dockRect, dp(10).toFloat(), dp(10).toFloat(), dashPaint)
                      canvas.drawText("缩放:${(zoom*100).toInt()}% (按住画面可拖动)", w * 0.5f, h * 0.82f, textPaint)

                      canvas.restore()
                      canvas.drawRoundRect(rect, dp(18).toFloat(), dp(18).toFloat(), framePaint)
                  }
              }

              private fun updateModeButtonsUI(selectedMode: Int) {
                  modeButtons.forEachIndexed { index, btn ->
                      btn.background = roundedBg(if (index == selectedMode) "#7B2CBF" else "#1E2638", dp(10))
                      btn.setTextColor(Color.parseColor(if (index == selectedMode) "#00F5D4" else "#D9E2EC"))
                  }
              }

              private fun createSectionCard(title: String): LinearLayout {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = roundedBg("#151C2C", dp(14))
                      setPadding(dp(15), dp(15), dp(15), dp(15))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(14) }
                  }
                  card.addView(TextView(this).apply {
                      text = title; textSize = 14.5f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#00BBF9")); setPadding(0, 0, 0, dp(6))
                  })
                  return card
              }

              private fun createSwitchRow(label: String, key: String, defVal: Boolean): View {
                  return Switch(this).apply {
                      text = label; textSize = 13f; setTextColor(Color.WHITE)
                      isChecked = prefs.getBoolean(key, defVal); setPadding(0, dp(8), 0, dp(8))
                      setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean(key, isChecked).apply() }
                  }
              }

              private fun copyUriToInternalFile(uri: Uri, targetName: String): Boolean {
                  return try {
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(File(filesDir, targetName)).use { output -> input.copyTo(output) }
                      }
                      true
                  } catch (_: Exception) { false }
              }

              private fun roundedBg(hex: String, r: Int) = GradientDrawable().apply { cornerRadius = r.toFloat(); setColor(Color.parseColor(hex)) }
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
