name: Build Nuclear Wallpaper 5.5 Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate 5.5 Architecture
        run: |
          pip install pillow
          mkdir -p app/src/main/java/com/i7ruhua/nuclearwallpaper
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/assets

          python3 - << 'PYEOF'
          import math
          from PIL import Image, ImageDraw, ImageFilter

          OUT = "app/src/main/res/drawable-nodpi"
          S = 512

          def base_box(c1, c2, border, glow):
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              grad = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              gd = ImageDraw.Draw(grad)
              for y in range(S):
                  t = y / float(S)
                  col = tuple(int(c1[i] * (1 - t) + c2[i] * t) for i in range(3)) + (248,)
                  gd.line([(0, y), (S, y)], fill=col)
              mask = Image.new("L", (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=255)
              img.paste(grad, (0, 0), mask)
              g = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              ImageDraw.Draw(g).ellipse([96, 96, S - 96, S - 96], fill=glow + (80,))
              img = Image.alpha_composite(img, g.filter(ImageFilter.GaussianBlur(40)))
              ImageDraw.Draw(img).rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=border, width=8)
              return img

          base_box((16, 23, 41), (8, 11, 22), (0, 245, 212, 190), (123, 44, 191)).save(f"{OUT}/icon_back.png")
          upon = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(upon).rounded_rectangle([10, 10, S - 10, S - 10], radius=116, outline=(0, 245, 212, 230), width=7)
          upon.save(f"{OUT}/icon_upon.png")
          mask_img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(mask_img).rounded_rectangle([8, 8, S - 8, S - 8], radius=118, fill=(255, 255, 255, 255))
          mask_img.save(f"{OUT}/icon_mask.png")

          def make_icon(name, a1, a2):
              b = base_box((18, 25, 46), (7, 10, 20), a1 + (235,), a2)
              ly = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(ly)
              cx = cy = S // 2
              for ang in [0, 60, 120]:
                  r = math.radians(ang)
                  pts = [(cx + 150*math.cos(math.radians(t))*math.cos(r) - 55*math.sin(math.radians(t))*math.sin(r),
                          cy + 150*math.cos(math.radians(t))*math.sin(r) + 55*math.sin(math.radians(t))*math.cos(r)) for t in range(0, 360, 8)]
                  d.polygon(pts, outline=a1 + (240,), width=10)
              d.ellipse([cx-36, cy-36, cx+36, cy+36], fill=a2+(255,), outline=(255,255,255,245), width=5)
              Image.alpha_composite(b, ly).save(f"{OUT}/{name}.png")

          make_icon("ic_launcher", (0,245,212), (247,37,133))
          make_icon("ic_nuclear_cyan", (0,187,249), (155,93,229))
          PYEOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NuclearWallpaper"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.i7ruhua.nuclearwallpaper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.i7ruhua.nuclearwallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "5.5-PRO"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">核芯壁纸引擎</string>
              <string name="icon_studio_name">核芯自定义图标包</string>
              <string name="wallpaper_desc">5.5 纯净版 · 单图独立参数记忆 | 动态壁纸实时预览 | 零后台轮播</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:settingsActivity="com.i7ruhua.nuclearwallpaper.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/appfilter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <iconback img1="icon_back" />
              <iconmask img1="icon_mask" />
              <iconupon img1="icon_upon" />
              <scale factor="0.78" />
              <item component="ComponentInfo{com.i7ruhua.nuclearwallpaper/com.i7ruhua.nuclearwallpaper.MainActivity}" drawable="ic_launcher" />
          </resources>
          EOF
          cp app/src/main/res/xml/appfilter.xml app/src/main/assets/appfilter.xml

          cat << 'EOF' > app/src/main/res/xml/drawable.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <version>1</version>
              <category title="核芯高定图标" />
              <item drawable="ic_launcher" />
              <item drawable="ic_nuclear_cyan" />
              <item drawable="icon_back" />
          </resources>
          EOF
          cp app/src/main/res/xml/drawable.xml app/src/main/assets/drawable.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true" android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".IconPickerActivity" android:exported="true" android:label="@string/icon_studio_name">
                      <intent-filter>
                          <action android:name="org.adw.launcher.THEMES" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="org.adw.launcher.icons.ACTION_PICK_ICON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.novalauncher.THEME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NuclearWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/IconPickerActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.Activity
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class IconPickerActivity : AppCompatActivity() {
              private val pickPhoto = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) }?.let { src ->
                          val sz = 240
                          val out = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                          val c = Canvas(out)
                          val sc = maxOf(sz.toFloat() / src.width, sz.toFloat() / src.height)
                          val m = Matrix().apply { setScale(sc, sc); postTranslate((sz - src.width * sc) * 0.5f, (sz - src.height * sc) * 0.5f) }
                          val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                              shader = BitmapShader(src, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP).apply { setLocalMatrix(m) }
                          }
                          val rect = RectF(6f, 6f, sz - 6f, sz - 6f)
                          c.drawRoundRect(rect, 54f, 54f, p)
                          src.recycle()
                          val res = Intent().apply { putExtra("icon", out); putExtra(Intent.EXTRA_SHORTCUT_ICON, out) }
                          setResult(Activity.RESULT_OK, res); finish()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0F19")
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#0B0F19"))
                      setPadding(dp(20), dp(32), dp(20), dp(32))
                  }
                  root.addView(TextView(this).apply {
                      text = "🎨 核芯自定义图标工坊"; textSize = 20f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#00F5D4"))
                  })
                  root.addView(Button(this).apply {
                      text = "🖼️ 从相册选任意图片生成一加圆角图标"
                      textSize = 15f; setTextColor(Color.parseColor("#0B0F19")); typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply { cornerRadius = dp(12).toFloat(); setColor(Color.parseColor("#00F5D4")) }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(18) }
                      setOnClickListener { pickPhoto.launch("image/*") }
                  })
                  setContentView(root)
              }
              private fun dp(v: Number) = (v.toFloat() * resources.displayMetrics.density).toInt()
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/i7ruhua/nuclearwallpaper/MainActivity.kt
          package com.i7ruhua.nuclearwallpaper

          import android.app.Dialog
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.Window
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

