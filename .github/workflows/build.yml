              private val addImagesLauncher = registerForActivityResult(ActivityResultContracts.GetMultipleContents()) { uris: List<Uri> ->
                  if (uris.isNotEmpty()) {
                      var added = 0
                      uris.forEachIndexed { idx, uri ->
                          val outFile = File(playlistDir, "item_${System.currentTimeMillis()}_$idx.jpg")
                          if (copyUriToFile(uri, outFile) && WallpaperConfig.isMediaFileValid(outFile, false)) {
                              added++
                          } else {
                              outFile.delete()
                          }
                      }
                      if (added > 0) {
                          selectPlaylistIndex(WallpaperConfig.getPlaylistFiles(this).size - 1)
                          Toast.makeText(this, "✅ 已加入 $added 张图片，每张均可独立保存尺寸！", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private val addVideoLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      val outFile = File(playlistDir, "item_${System.currentTimeMillis()}.mp4")
                      if (copyUriToFile(uri, outFile) && WallpaperConfig.isMediaFileValid(outFile, true)) {
                          selectPlaylistIndex(WallpaperConfig.getPlaylistFiles(this).size - 1)
                          Toast.makeText(this, "✅ 动态视频已加入轮播池！", Toast.LENGTH_SHORT).show()
                      } else {
                          outFile.delete()
                          Toast.makeText(this, "⚠️ 视频文件损坏或格式不支持", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

